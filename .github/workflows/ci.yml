# filename: .github/workflows/ci.yml
name: CI Pipeline

# Gating policy (measured 2026-08-04):
#
#   Pull requests run lint + validate-models + the fast suite: about 5 minutes.
#   Everything heavier -- the four integration shards, multi-year invariants, the
#   edge-config matrix, and the coverage gate -- runs on push to main/develop, on
#   the nightly schedule, and on demand.
#
# The full pipeline measured ~66 minutes of wall time on PR #545 (shards at
# 49/65/49/63 min, edge-config-matrix 14m, multi-year-invariants 5m). Paying that
# on every push made the feedback loop unusable, and it is dominated by
# integration tests driving real dbt runs rather than by anything a typical PR
# touches.
#
# To run the full pipeline against a PR before merging, add the `full-ci` label.
# There is no branch protection on main, so skipped jobs cannot deadlock a merge;
# if required status checks are ever enabled, revisit this -- required checks that
# never run will block merges.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full run at 07:00 UTC so integration regressions merged during the
    # day are caught before the next morning.
    - cron: '0 7 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt

      - name: Run linting
        run: |
          black --check .
          ruff check .
          mypy planalign_orchestrator/ planalign_cli/ planalign_core/ --ignore-missing-imports

  # The PR gate. Unit-only, no dbt runs, no database: ~4 minutes for ~2,180
  # tests. This is the check developers wait on, so keep it fast -- anything
  # needing a real dbt invocation belongs in `test` below, not here.
  fast-tests:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Same requirements files as the sharded `test` job, so the two cannot
          # drift. `dbt deps` is deliberately omitted: nothing marked `fast` may
          # invoke dbt, and skipping it keeps this job lean.
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt

      - name: Run fast test suite
        env:
          # Same runner-temp sentinel discipline as the sharded job: the fast
          # suite must never reach the global database either.
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-fast.duckdb
        run: pytest -m fast -q

      - name: Assert default database sentinel remains unused
        if: always()
        env:
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-fast.duckdb
        run: |
          if [ -e "$DATABASE_PATH" ]; then
            echo "::error::A test reached the global/default database path: $DATABASE_PATH"
            echo "This runner.temp sentinel must remain absent; tests must use explicit isolated databases."
            echo "Likely cause: code fell back to get_database_path() instead of a test fixture database."
            echo "See CLAUDE.md §8 (validate in isolated databases) and tests/conftest.py's shared_dev_database_guard."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs: lint
    # Skipped on pull requests unless the `full-ci` label is present -- see the
    # gating policy comment at the top of this file. Runs in full on push to
    # main/develop, nightly, and via workflow_dispatch.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    # Sharded across 4 runners: this job was ~96 of the pipeline's ~102 minutes,
    # and it is dominated by integration tests that drive real dbt runs. Wall
    # time is max(shard), not the sum, so 4 shards cut it to roughly a quarter.
    #
    # NOTE (2026-08-04): measured shard times on PR #545 were 49/65/49/63 min,
    # far above the ~25 min this split was sized for, and `.test_durations`
    # records only 59.9 min total across 2,738 tests -- roughly 4x stale, which
    # is why the shards are imbalanced. Refresh it (see below) before trusting
    # the balance.
    #
    # Sharding rather than pytest-xdist (`-n auto`) is deliberate. The execution
    # lock is a single file in the working directory (utils.py: `.{name}.lock`),
    # so xdist workers -- which share one checkout -- contend on it and fail with
    # "Failed to acquire execution lock". Measured: 2 such failures under
    # `-n auto`. Each shard is its own runner with its own filesystem, so the
    # lock behaves exactly as it does today.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt
          # Trigger the sqlparse MAX_GROUPING_TOKENS auto-patch (see
          # planalign_orchestrator.sqlparse_config) so dbt subprocesses spawned
          # by integration tests don't hit sqlparse's 10,000-token limit.
          python -c "import planalign_orchestrator"

      - name: Install dbt packages
        run: |
          # A few integration tests (e.g. the fresh-vs-preinitialized parity
          # contract) drive a real single-year dbt simulation, which needs the
          # dbt packages from packages.yml installed.
          cd dbt
          dbt deps

      - name: Run Python tests (shard ${{ matrix.shard }}/4)
        env:
          # Keep each shard's coverage data in its own file so the combine step
          # below can merge them without clobbering.
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
          # Point the CI fallback at a runner-local sentinel, never the tracked
          # shared dev DB. Tests must provide their own isolated database; the
          # always-run assertion below detects an unexpected fallback.
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-shard-${{ matrix.shard }}.duckdb
        run: |
          # multi_year_invariants is excluded here: those multi-year suites run
          # in the dedicated multi-year-invariants job (with failure-artifact
          # capture and a longer timeout). Lighter integration tests that drive
          # a real dbt run stay here and rely on the dbt deps installed above.
          #
          # --splits/--group partitions the suite deterministically, so every
          # test runs exactly once across the four shards.
          #
          # least_duration balances by the measured times in .test_durations,
          # not by test count. Count-based splitting does NOT work here: the
          # suite is extremely top-heavy (the two slowest tests are 29% of total
          # runtime), so an even split by count still put ~40 minutes of work in
          # one shard while the others finished in under 5.
          #
          # Refresh .test_durations with:
          #   pytest tests/ -m "not multi_year_invariants" --store-durations
          # Stale entries are harmless -- unknown tests fall back to an average.
          #
          # No --cov-fail-under here: a single shard only ever sees a quarter of
          # the suite and would fail the gate spuriously. The threshold is
          # enforced once, on the combined data, in the `coverage` job.
          pytest tests/ -v -m "not multi_year_invariants" \
            --splits 4 --group ${{ matrix.shard }} \
            --splitting-algorithm least_duration \
            --cov=planalign_orchestrator --cov=planalign_cli \
            --cov=planalign_api --cov=planalign_core \
            --cov-report=

      - name: Assert default database sentinel remains unused (shard ${{ matrix.shard }}/4)
        if: always()
        env:
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-shard-${{ matrix.shard }}.duckdb
        run: |
          if [ -e "$DATABASE_PATH" ]; then
            echo "::error::A test reached the global/default database path: $DATABASE_PATH"
            echo "This runner.temp sentinel must remain absent; tests must use explicit isolated databases."
            echo "Likely cause: code fell back to get_database_path() instead of a test fixture database."
            echo "See CLAUDE.md §8 (validate in isolated databases) and tests/conftest.py's shared_dev_database_guard."
            exit 1
          fi

      - name: Upload shard coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

      # NOTE: no raw `dbt run` here — a full build requires a census parquet
      # (git-ignored) and orchestrator-created tables (e.g.
      # enrollment_decision_projection). dbt compilation is validated in the
      # validate-models job; behavioral dbt tests run locally against
      # isolated databases per the CLAUDE.md validation rule.

  coverage:
    # Enforces the coverage gate once, on the four shards combined. Splitting the
    # test job means no single run sees the whole suite, so the threshold cannot
    # live in the shards.
    #
    # Consequence of the PR gating policy: `test` is skipped on unlabelled PRs,
    # so this job is skipped with it and the coverage threshold is NOT enforced
    # per-PR. It is enforced on push to main/develop and nightly. Label a PR
    # `full-ci` to check coverage before merging.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage
        run: pip install coverage==7.*

      - name: Download shard coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine and enforce threshold
        run: |
          coverage combine .coverage.*
          coverage xml
          # Coverage gate: actual coverage is ~63% (2026-07); ratchet the
          # threshold up as coverage improves, never down.
          coverage report --fail-under=60

      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  multi-year-invariants:
    runs-on: ubuntu-latest
    needs: lint
    # Skipped on PRs without the `full-ci` label -- see gating policy at top.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt
          # Trigger the sqlparse MAX_GROUPING_TOKENS auto-patch (see
          # planalign_orchestrator.sqlparse_config) so dbt subprocesses in
          # this job don't hit sqlparse's 10,000-token DoS-protection limit.
          python -c "import planalign_orchestrator"

      - name: Install dbt packages
        run: |
          cd dbt
          dbt deps

      - name: Run multi-year invariant suite
        env:
          # This sentinel exposes tests that bypass their isolated database.
          # The assertion below must remain so the guard stays non-vacuous.
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-multi-year-invariants.duckdb
        run: |
          mkdir -p var/test-artifacts/113
          set -o pipefail
          pytest -m multi_year_invariants -v 2>&1 | tee var/test-artifacts/113/diagnostics.log

      - name: Assert default database sentinel remains unused
        if: always()
        env:
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-multi-year-invariants.duckdb
        run: |
          if [ -e "$DATABASE_PATH" ]; then
            echo "::error::A test reached the global/default database path: $DATABASE_PATH"
            echo "This runner.temp sentinel must remain absent; tests must use explicit isolated databases."
            echo "Likely cause: code fell back to get_database_path() instead of a test fixture database."
            echo "See CLAUDE.md §8 (validate in isolated databases) and tests/conftest.py's shared_dev_database_guard."
            exit 1
          fi

      - name: Preserve failed invariant databases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multi-year-invariants
          path: var/test-artifacts/113/
          retention-days: 7

  edge-config-matrix:
    runs-on: ubuntu-latest
    needs: lint
    # Skipped on PRs without the `full-ci` label -- see gating policy at top.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    # Four sequential two-year simulations. Each costs ~105s on a GitHub runner
    # (~2x a dev laptop), so the suite needs ~8min wall including setup.
    # Matches multi-year-invariants, the sibling job that also runs real sims.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -c "import planalign_orchestrator"
      - name: Install dbt packages
        run: cd dbt && dbt deps
      - name: Run edge configuration matrix
        env:
          # This sentinel exposes tests that bypass their isolated database.
          # The assertion below must remain so the guard stays non-vacuous.
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-edge-config-matrix.duckdb
        run: |
          mkdir -p var/test-artifacts/124
          set -o pipefail
          pytest -m edge_config_matrix -v --durations=10 2>&1 | tee var/test-artifacts/124/diagnostics.log

      - name: Assert default database sentinel remains unused
        if: always()
        env:
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-edge-config-matrix.duckdb
        run: |
          if [ -e "$DATABASE_PATH" ]; then
            echo "::error::A test reached the global/default database path: $DATABASE_PATH"
            echo "This runner.temp sentinel must remain absent; tests must use explicit isolated databases."
            echo "Likely cause: code fell back to get_database_path() instead of a test fixture database."
            echo "See CLAUDE.md §8 (validate in isolated databases) and tests/conftest.py's shared_dev_database_guard."
            exit 1
          fi
      - name: Preserve failed matrix artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: edge-config-matrix
          path: var/test-artifacts/124/
          retention-days: 7

  validate-models:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dbt
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system dbt-core==1.8.8 dbt-duckdb==1.8.1
          uv pip install --system -e .
          # Trigger the sqlparse MAX_GROUPING_TOKENS auto-patch (see
          # planalign_orchestrator.sqlparse_config) so dbt subprocesses in
          # this job don't hit sqlparse's 10,000-token DoS-protection limit.
          python -c "import planalign_orchestrator"

      - name: Validate dbt project
        run: |
          cd dbt
          dbt deps
          # Band macros read seed tables at compile time (run_query), so
          # seeds must be loaded before parse/compile.
          dbt seed --profiles-dir . --threads 1
          dbt parse --profiles-dir .
          dbt compile --profiles-dir .
