# filename: .github/workflows/ci.yml
name: CI Pipeline

# PRs run lint, Studio, fast tests, the dependency audit and model validation.
# Simulations, full integration and coverage run on main/develop, nightly,
# dispatch, or with the full-ci label. A failed run on main opens an issue.
# Require `CI Gate` in repository rulesets to enforce this conditional policy.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    # Nightly full run at 07:00 UTC so integration regressions merged during the
    # day are caught before the next morning.
    - cron: '0 7 * * *'
  workflow_dispatch:

# Cancel obsolete PR commits, but retain every post-merge/nightly evidence run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'

jobs:
  ci-scope:
    runs-on: ubuntu-latest
    outputs:
      simulation: ${{ steps.scope.outputs.simulation }}
      full: ${{ steps.scope.outputs.full }}
      suites: ${{ steps.scope.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select required suites
        id: scope
        run: python3 scripts/ci_policy.py select

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: planalign_studio/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --prefix planalign_studio

      # Fails on high/critical advisories except reviewed, expiring exceptions
      # in planalign_studio/scripts/audit-dependencies.mjs. Each one needs a
      # matching "Approved Studio Dependency Exceptions" row in SECURITY.md.
      - name: Audit frontend dependencies
        run: npm run audit:dependencies --prefix planalign_studio

      - name: Check generated API types are current
        # services/api.generated.ts is generated from the committed OpenAPI
        # snapshot (itself pinned to the live API by tests/api/
        # test_openapi_contract.py), so backend response-model changes that
        # Studio hasn't picked up fail here instead of at runtime (#661).
        run: |
          npm run generate:api-types --prefix planalign_studio
          git diff --exit-code -- planalign_studio/services/api.generated.ts

      - name: Typecheck frontend
        run: npm run typecheck --prefix planalign_studio

      - name: Lint frontend
        run: npm run lint --prefix planalign_studio

      - name: Test frontend
        run: npm test --prefix planalign_studio

      - name: Build frontend
        run: npm run build --prefix planalign_studio

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt

      - name: Run linting
        run: |
          python scripts/check_worktree_gitlinks.py
          black --check .
          ruff check .
          mypy planalign_orchestrator/ planalign_cli/ planalign_core/ planalign_api/ planalign_fit/ planalign_ensemble/ planalign_optimizer/ planalign_evidence/ planalign_backtest/ --ignore-missing-imports

  # Blocking gate over the resolved Python dependency graph (#705). Runs on
  # every PR/push -- pip-audit is a dependency-resolve + vulnerability-DB
  # lookup, comparable cost to `lint`, so there is no reason to gate it
  # behind `full-ci`.
  #
  # Findings not covered by an --ignore-vuln below fail the build. Each
  # ignored ID is a reviewed, temporary exception -- see "Approved Python
  # Dependency Exceptions" in SECURITY.md for the advisory, exposure
  # assessment, owner, and review date behind every entry. Do not add an
  # --ignore-vuln here without a matching SECURITY.md entry.
  python-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit runtime dependencies (requirements.txt)
        run: pip-audit -r requirements.txt

      - name: Audit dev dependencies (requirements-dev.txt)
        run: pip-audit -r requirements-dev.txt

  # The PR gate. About 3,250 tests run on 4 xdist workers; recent hosted
  # timings vary from 368-463s (see #928). Budget is enforced below per
  # constitution.md III.
  # This is the check developers wait on, so keep it fast -- anything
  # needing a real dbt invocation belongs in `test` below, not here.
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Same requirements files as the sharded `test` job, so the two cannot
          # drift.
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt

      - name: Install dbt packages
        run: |
          # The graph/workflow contract tests (tests/unit/orchestrator/
          # test_pipeline_graph_contract.py, test_pipeline_stage_ownership.py,
          # test_workflow_graph_contract.py) are auto-marked `fast` by path
          # (tests/conftest.py's pytest_collection_modifyitems) but run a real
          # `dbt parse` via tests/helpers/dbt_manifest.py, which fails without
          # the packages in packages.yml installed. This keeps them runnable
          # on every PR instead of deferring architecture-contract checks to
          # push/nightly/full-ci.
          cd dbt
          dbt deps

      - name: Run fast test suite
        env:
          # Same runner-temp sentinel discipline as the sharded job: the fast
          # suite must never reach the global database either.
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-fast.duckdb
        run: |
          # Constitution III tracks the fast suite's wall-clock time (see #648).
          # Runner speed swings it widely (#928, #1083), so drift only warns.
          # --dist load: tests must not depend on sharing a worker with their
          # file-mates; keep collection deterministic (no uuid4() in IDs).
          FAST_SUITE_WARNING_SECONDS=540
          start=$(date +%s)
          pytest -m fast -q -n 4 --dist load --durations=40
          status=$?
          elapsed=$(( $(date +%s) - start ))
          echo "Fast suite took ${elapsed}s (warning above: ${FAST_SUITE_WARNING_SECONDS}s)"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$elapsed" -gt "$FAST_SUITE_WARNING_SECONDS" ]; then
            echo "::warning::Fast suite took ${elapsed}s, above the ${FAST_SUITE_WARNING_SECONDS}s warning threshold. Re-profile with 'pytest -m fast --durations=50' if this persists."
          fi

      - name: Assert default database sentinel remains unused
        if: always()
        env:
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-fast.duckdb
        run: |
          if [ -e "$DATABASE_PATH" ]; then
            echo "::error::A test reached the global/default database path: $DATABASE_PATH"
            echo "This runner.temp sentinel must remain absent; tests must use explicit isolated databases."
            echo "Likely cause: code fell back to get_database_path() instead of a test fixture database."
            echo "See CLAUDE.md §8 (validate in isolated databases) and tests/conftest.py's shared_dev_database_guard."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs: ci-scope
    # Skipped on pull requests unless the `full-ci` label is present -- see the
    # gating policy comment at the top of this file. Runs in full on push to
    # main/develop, nightly, and via workflow_dispatch.
    if: needs.ci-scope.outputs.full == 'true'
    # Eight independent runners, balanced using measured test durations.
    # Four shards had grown to 60-70 minutes each. Refresh and compare
    # complete runs per docs/guides/ci_measurements.md.
    #
    # Sharding rather than pytest-xdist (`-n auto`) is deliberate. The execution
    # lock is a single file in the working directory (utils.py: `.{name}.lock`),
    # so xdist workers -- which share one checkout -- contend on it and fail with
    # "Failed to acquire execution lock". Measured: 2 such failures under
    # `-n auto`. Each shard is its own runner with its own filesystem, so the
    # lock behaves exactly as it does today.
    #
    # The timeout only stops a hung shard; it is not the time budget.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt
          # Trigger the sqlparse MAX_GROUPING_TOKENS auto-patch (see
          # planalign_orchestrator.sqlparse_config) so dbt subprocesses spawned
          # by integration tests don't hit sqlparse's 10,000-token limit.
          python -c "import planalign_orchestrator"

      - name: Install dbt packages
        run: |
          # A few integration tests (e.g. the fresh-vs-preinitialized parity
          # contract) drive a real single-year dbt simulation, which needs the
          # dbt packages from packages.yml installed.
          cd dbt
          dbt deps

      - name: Run Python tests (shard ${{ matrix.shard }}/8)
        env:
          # Keep each shard's coverage data in its own file so the combine step
          # below can merge them without clobbering.
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
          # Point the CI fallback at a runner-local sentinel, never the tracked
          # shared dev DB. Tests must provide their own isolated database; the
          # always-run assertion below detects an unexpected fallback.
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-shard-${{ matrix.shard }}.duckdb
        run: |
          # The simulation suites are excluded here: they run in the
          # simulation-suites job, one runner per file. Lighter integration
          # tests that drive a real dbt run stay here and rely on the dbt deps
          # installed above.
          #
          # --file-shard (tests/file_shards.py) assigns whole test files, so
          # every file runs in exactly one shard and a simulation fixture its
          # tests share is built once. Splitting by single test spread such
          # files over five or six shards, and each rebuilt the fixture.
          #
          # Files are weighed by the seconds in .test_durations, fixtures
          # included. The run reads the committed weights, then overwrites the
          # file with this shard's own measurements for the next refresh
          # (see docs/guides/ci_measurements.md).
          #
          # No --cov-fail-under here: a single shard only ever sees part of
          # the suite and would fail the gate spuriously. The threshold is
          # enforced once, on the combined data, in the `coverage` job.
          pytest tests/ -v -m "not multi_year_invariants and not edge_config_matrix" \
            --file-shard ${{ matrix.shard }}/8 \
            --store-file-durations .test_durations \
            --cov --cov-config=pyproject.toml \
            --cov-report=

      - name: Upload shard timings
        uses: actions/upload-artifact@v7
        with:
          name: test-durations-${{ matrix.shard }}
          path: .test_durations
          include-hidden-files: true
          if-no-files-found: error

      - name: Assert default database sentinel remains unused (shard ${{ matrix.shard }}/8)
        if: always()
        env:
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-shard-${{ matrix.shard }}.duckdb
        run: |
          if [ -e "$DATABASE_PATH" ]; then
            echo "::error::A test reached the global/default database path: $DATABASE_PATH"
            echo "This runner.temp sentinel must remain absent; tests must use explicit isolated databases."
            echo "Likely cause: code fell back to get_database_path() instead of a test fixture database."
            echo "See CLAUDE.md §8 (validate in isolated databases) and tests/conftest.py's shared_dev_database_guard."
            exit 1
          fi

      - name: Upload shard coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

      # NOTE: no raw `dbt run` here — a full build requires a census parquet
      # (git-ignored) and orchestrator-created tables (e.g.
      # enrollment_decision_projection). dbt compilation is validated in the
      # validate-models job; behavioral dbt tests run locally against
      # isolated databases per the CLAUDE.md validation rule.

  coverage:
    # Enforces the coverage gate once, on the shards combined. Splitting the
    # test job means no single run sees the whole suite, so the threshold cannot
    # live in the shards.
    #
    # Consequence of the PR gating policy: `test` is skipped on unlabelled PRs,
    # so this job is skipped with it and the coverage threshold is NOT enforced
    # per-PR. It is enforced on push to main/develop and nightly. Label a PR
    # `full-ci` to check coverage before merging.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage
        run: pip install coverage==7.*

      - name: Download shard coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine and enforce threshold
        run: |
          coverage combine .coverage.*
          coverage xml
          coverage json
          python scripts/check_coverage_inventory.py
          # Ratchet to 75% after complete nine-package runs measured 77.54%
          # and 77.88% (#874); investigate regressions rather than lower the gate.
          coverage report --fail-under=75

      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: |
            coverage.xml
            coverage.json

  simulation-suites:
    name: simulation (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: ci-scope
    if: needs.ci-scope.outputs.simulation == 'true'
    # One runner per simulation test file, so wall time is the slowest file
    # (about 11 minutes on a slow runner) instead of the sum of all of them.
    # Run serially, these suites outgrew a 30-minute limit and left main red.
    # scripts/ci_policy.py finds the files by marker, and tests/conftest.py
    # rejects a marked test that the search would miss, so a new suite gets a
    # runner without editing this file.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.ci-scope.outputs.suites) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt
          # Trigger the sqlparse MAX_GROUPING_TOKENS auto-patch (see
          # planalign_orchestrator.sqlparse_config) so dbt subprocesses in
          # this job don't hit sqlparse's 10,000-token DoS-protection limit.
          python -c "import planalign_orchestrator"

      - name: Install dbt packages
        run: |
          cd dbt
          dbt deps

      - name: Run simulation suite
        env:
          SUITE: ${{ matrix.suite }}
          # This sentinel exposes tests that bypass their isolated database.
          # The assertion below must remain so the guard stays non-vacuous.
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-simulation-suite.duckdb
        run: |
          mkdir -p var/test-artifacts
          set -o pipefail
          pytest "$SUITE" -m "multi_year_invariants or edge_config_matrix" -v --durations=10 \
            2>&1 | tee var/test-artifacts/diagnostics.log

      - name: Assert default database sentinel remains unused
        if: always()
        env:
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-simulation-suite.duckdb
        run: |
          if [ -e "$DATABASE_PATH" ]; then
            echo "::error::A test reached the global/default database path: $DATABASE_PATH"
            echo "This runner.temp sentinel must remain absent; tests must use explicit isolated databases."
            echo "Likely cause: code fell back to get_database_path() instead of a test fixture database."
            echo "See CLAUDE.md §8 (validate in isolated databases) and tests/conftest.py's shared_dev_database_guard."
            exit 1
          fi

      - name: Preserve failed simulation databases
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: simulation-suite-${{ strategy.job-index }}
          path: var/test-artifacts/
          retention-days: 7

  validate-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dbt
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system -e .
          python scripts/check_dbt_versions.py
          # Trigger the sqlparse MAX_GROUPING_TOKENS auto-patch (see
          # planalign_orchestrator.sqlparse_config) so dbt subprocesses in
          # this job don't hit sqlparse's 10,000-token DoS-protection limit.
          python -c "import planalign_orchestrator"

      # Editable installs hide packaging gaps; install the built wheel into a
      # clean venv and import every shipped package from outside the checkout.
      - name: Verify non-editable wheel install
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv venv "$RUNNER_TEMP/wheel-venv" --python "$PYTHON_VERSION"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          wheel-venv/bin/python "$GITHUB_WORKSPACE/scripts/check_wheel_imports.py"
          wheel-venv/bin/planalign --help > /dev/null

      - name: Validate dbt project
        env:
          # Seed relations use an unquoted catalog name derived from this stem.
          DATABASE_PATH: ${{ runner.temp }}/planalign_ci_model_validation.duckdb
        run: |
          cd dbt
          dbt deps
          # Band macros read seed tables at compile time (run_query), so
          # seeds must be loaded before parse/compile.
          dbt seed --profiles-dir . --threads 1
          dbt parse --profiles-dir . --threads 1
          dbt compile --profiles-dir . --threads 1

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [ci-scope, lint, studio, fast-tests, python-dependency-audit, validate-models, test, coverage, simulation-suites]
    steps:
      - uses: actions/checkout@v7
      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_policy.py gate

  main-alert:
    name: Report failure on main
    runs-on: ubuntu-latest
    needs: [ci-gate]
    # Simulations and integration only run after merge, so a red run on main is
    # the first sign of a regression. Report every one, not just the nightly.
    if: >-
      always() && needs.ci-gate.result == 'failure' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    permissions:
      issues: write
    steps:
      - name: Open one issue for a failed run on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI failed on main"
          # List rather than search: the search index lags, and two merges
          # failing minutes apart would each open an issue.
          open=$(gh issue list --state open --limit 500 --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ -z "$open" ]; then
            gh issue create --title "$title" --body "CI failed on main: $RUN_URL"
          else
            gh issue comment "$open" --body "Failed again: $RUN_URL"
          fi
