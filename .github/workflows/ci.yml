# filename: .github/workflows/ci.yml
name: CI Pipeline

# All PRs retain the existing required checks. Backend/unknown changes also run
# multi-year and edge-config simulations; prose/frontend-only changes omit them.
# Full integration + coverage runs on main/develop, nightly, dispatch, or full-ci.
# Require `CI Gate` in repository rulesets to enforce this conditional policy.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    # Nightly full run at 07:00 UTC so integration regressions merged during the
    # day are caught before the next morning.
    - cron: '0 7 * * *'
  workflow_dispatch:

# Cancel obsolete PR commits, but retain every post-merge/nightly evidence run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'

jobs:
  ci-scope:
    runs-on: ubuntu-latest
    outputs:
      simulation: ${{ steps.scope.outputs.simulation }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select required suites
        id: scope
        run: python3 scripts/ci_policy.py select

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: planalign_studio/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --prefix planalign_studio

      - name: Audit frontend dependencies
        run: npm run audit:dependencies --prefix planalign_studio

      - name: Check generated API types are current
        # services/api.generated.ts is generated from the committed OpenAPI
        # snapshot (itself pinned to the live API by tests/api/
        # test_openapi_contract.py), so backend response-model changes that
        # Studio hasn't picked up fail here instead of at runtime (#661).
        run: |
          npm run generate:api-types --prefix planalign_studio
          git diff --exit-code -- planalign_studio/services/api.generated.ts

      - name: Typecheck frontend
        run: npm run typecheck --prefix planalign_studio

      - name: Lint frontend
        run: npm run lint --prefix planalign_studio

      - name: Test frontend
        run: npm test --prefix planalign_studio

      - name: Build frontend
        run: npm run build --prefix planalign_studio

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt

      - name: Run linting
        run: |
          python scripts/check_worktree_gitlinks.py
          black --check .
          ruff check .
          mypy planalign_orchestrator/ planalign_cli/ planalign_core/ planalign_api/ planalign_fit/ planalign_ensemble/ planalign_optimizer/ planalign_evidence/ planalign_backtest/ --ignore-missing-imports

  # Blocking gate over the resolved Python dependency graph (#705). Runs on
  # every PR/push -- pip-audit is a dependency-resolve + vulnerability-DB
  # lookup, comparable cost to `lint`, so there is no reason to gate it
  # behind `full-ci`.
  #
  # Findings not covered by an --ignore-vuln below fail the build. Each
  # ignored ID is a reviewed, temporary exception -- see "Approved Python
  # Dependency Exceptions" in SECURITY.md for the advisory, exposure
  # assessment, owner, and review date behind every entry. Do not add an
  # --ignore-vuln here without a matching SECURITY.md entry.
  python-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit runtime dependencies (requirements.txt)
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-3696 \
            --ignore-vuln PYSEC-2026-3697 \
            --ignore-vuln PYSEC-2026-3698 \
            --ignore-vuln PYSEC-2026-3699 \
            --ignore-vuln PYSEC-2026-3923

      - name: Audit dev dependencies (requirements-dev.txt)
        run: |
          pip-audit -r requirements-dev.txt \
            --ignore-vuln PYSEC-2024-48 \
            --ignore-vuln PYSEC-2026-2120 \
            --ignore-vuln PYSEC-2026-2121

  # The PR gate. Unit-only, no dbt runs, no database: ~330s for ~2,800 tests
  # on 4 xdist workers as of 2026-09-28 (budget enforced below per
  # constitution.md III, #648).
  # This is the check developers wait on, so keep it fast -- anything
  # needing a real dbt invocation belongs in `test` below, not here.
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Same requirements files as the sharded `test` job, so the two cannot
          # drift.
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt

      - name: Install dbt packages
        run: |
          # The graph/workflow contract tests (tests/unit/orchestrator/
          # test_pipeline_graph_contract.py, test_pipeline_stage_ownership.py,
          # test_workflow_graph_contract.py) are auto-marked `fast` by path
          # (tests/conftest.py's pytest_collection_modifyitems) but run a real
          # `dbt parse` via tests/helpers/dbt_manifest.py, which fails without
          # the packages in packages.yml installed. This keeps them runnable
          # on every PR instead of deferring architecture-contract checks to
          # push/nightly/full-ci.
          cd dbt
          dbt deps

      - name: Run fast test suite
        env:
          # Same runner-temp sentinel discipline as the sharded job: the fast
          # suite must never reach the global database either.
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-fast.duckdb
        run: |
          # Constitution III caps the fast suite's wall-clock time (see #648).
          # Budget is ~1.25x the worst observed time on GitHub-hosted runners:
          # 322-356s with -n 4 (one worker per vCPU) vs 615-915s serial, as of
          # 2026-09-28. Re-measure here, not on a laptop, when re-baselining.
          # --dist load: tests must not depend on sharing a worker with their
          # file-mates; keep collection deterministic (no uuid4() in IDs).
          FAST_SUITE_BUDGET_SECONDS=450
          start=$(date +%s)
          pytest -m fast -q -n 4 --dist load
          status=$?
          elapsed=$(( $(date +%s) - start ))
          echo "Fast suite took ${elapsed}s (budget: ${FAST_SUITE_BUDGET_SECONDS}s)"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$elapsed" -gt "$FAST_SUITE_BUDGET_SECONDS" ]; then
            echo "::error::Fast suite took ${elapsed}s, exceeding the ${FAST_SUITE_BUDGET_SECONDS}s budget in constitution.md III. Re-profile with 'pytest -m fast --durations=50' and either fix the regression or re-baseline the budget."
            exit 1
          fi

      - name: Assert default database sentinel remains unused
        if: always()
        env:
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-fast.duckdb
        run: |
          if [ -e "$DATABASE_PATH" ]; then
            echo "::error::A test reached the global/default database path: $DATABASE_PATH"
            echo "This runner.temp sentinel must remain absent; tests must use explicit isolated databases."
            echo "Likely cause: code fell back to get_database_path() instead of a test fixture database."
            echo "See CLAUDE.md §8 (validate in isolated databases) and tests/conftest.py's shared_dev_database_guard."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs: ci-scope
    # Skipped on pull requests unless the `full-ci` label is present -- see the
    # gating policy comment at the top of this file. Runs in full on push to
    # main/develop, nightly, and via workflow_dispatch.
    if: needs.ci-scope.outputs.full == 'true'
    # Four independent runners, balanced using measured test durations.
    # Historical measurements above are not a current performance baseline.
    # Refresh and compare complete runs per docs/guides/ci_measurements.md.
    #
    # Sharding rather than pytest-xdist (`-n auto`) is deliberate. The execution
    # lock is a single file in the working directory (utils.py: `.{name}.lock`),
    # so xdist workers -- which share one checkout -- contend on it and fail with
    # "Failed to acquire execution lock". Measured: 2 such failures under
    # `-n auto`. Each shard is its own runner with its own filesystem, so the
    # lock behaves exactly as it does today.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt
          # Trigger the sqlparse MAX_GROUPING_TOKENS auto-patch (see
          # planalign_orchestrator.sqlparse_config) so dbt subprocesses spawned
          # by integration tests don't hit sqlparse's 10,000-token limit.
          python -c "import planalign_orchestrator"

      - name: Install dbt packages
        run: |
          # A few integration tests (e.g. the fresh-vs-preinitialized parity
          # contract) drive a real single-year dbt simulation, which needs the
          # dbt packages from packages.yml installed.
          cd dbt
          dbt deps

      - name: Run Python tests (shard ${{ matrix.shard }}/4)
        env:
          # Keep each shard's coverage data in its own file so the combine step
          # below can merge them without clobbering.
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
          # Point the CI fallback at a runner-local sentinel, never the tracked
          # shared dev DB. Tests must provide their own isolated database; the
          # always-run assertion below detects an unexpected fallback.
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-shard-${{ matrix.shard }}.duckdb
        run: |
          # multi_year_invariants is excluded here: those multi-year suites run
          # in the dedicated multi-year-invariants job (with failure-artifact
          # capture and a longer timeout). Lighter integration tests that drive
          # a real dbt run stay here and rely on the dbt deps installed above.
          #
          # --splits/--group partitions the suite deterministically, so every
          # test runs exactly once across the four shards.
          #
          # least_duration balances by the measured times in .test_durations,
          # not by test count. Count-based splitting does NOT work here: the
          # suite is extremely top-heavy (the two slowest tests are 29% of total
          # runtime), so an even split by count still put ~40 minutes of work in
          # one shard while the others finished in under 5.
          #
          # Read the committed timings for assignment, then replace them with
          # this shard's observations only. Never merge inherited stale entries.
          # Download all four timing artifacts to refresh (see CI guide).
          #
          # No --cov-fail-under here: a single shard only ever sees a quarter of
          # the suite and would fail the gate spuriously. The threshold is
          # enforced once, on the combined data, in the `coverage` job.
          pytest tests/ -v -m "not multi_year_invariants" \
            --splits 4 --group ${{ matrix.shard }} \
            --splitting-algorithm least_duration \
            --store-durations --clean-durations \
            --cov --cov-config=pyproject.toml \
            --cov-report=

      - name: Upload shard timings
        uses: actions/upload-artifact@v4
        with:
          name: test-durations-${{ matrix.shard }}
          path: .test_durations
          include-hidden-files: true
          if-no-files-found: error

      - name: Assert default database sentinel remains unused (shard ${{ matrix.shard }}/4)
        if: always()
        env:
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-shard-${{ matrix.shard }}.duckdb
        run: |
          if [ -e "$DATABASE_PATH" ]; then
            echo "::error::A test reached the global/default database path: $DATABASE_PATH"
            echo "This runner.temp sentinel must remain absent; tests must use explicit isolated databases."
            echo "Likely cause: code fell back to get_database_path() instead of a test fixture database."
            echo "See CLAUDE.md §8 (validate in isolated databases) and tests/conftest.py's shared_dev_database_guard."
            exit 1
          fi

      - name: Upload shard coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

      # NOTE: no raw `dbt run` here — a full build requires a census parquet
      # (git-ignored) and orchestrator-created tables (e.g.
      # enrollment_decision_projection). dbt compilation is validated in the
      # validate-models job; behavioral dbt tests run locally against
      # isolated databases per the CLAUDE.md validation rule.

  coverage:
    # Enforces the coverage gate once, on the four shards combined. Splitting the
    # test job means no single run sees the whole suite, so the threshold cannot
    # live in the shards.
    #
    # Consequence of the PR gating policy: `test` is skipped on unlabelled PRs,
    # so this job is skipped with it and the coverage threshold is NOT enforced
    # per-PR. It is enforced on push to main/develop and nightly. Label a PR
    # `full-ci` to check coverage before merging.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage
        run: pip install coverage==7.*

      - name: Download shard coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine and enforce threshold
        run: |
          coverage combine .coverage.*
          coverage xml
          coverage json
          python scripts/check_coverage_inventory.py
          # Preserve the 60% gate as the denominator expands (#874). The JSON
          # inventory prints each package's measured numerator/denominator;
          # a lower result must be investigated, not hidden by lowering this.
          coverage report --fail-under=60

      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: |
            coverage.xml
            coverage.json

  multi-year-invariants:
    runs-on: ubuntu-latest
    needs: ci-scope
    if: needs.ci-scope.outputs.simulation == 'true'
    # Recent successful runs take 16-20 minutes; leave enough headroom for
    # normal hosted-runner variance without masking a genuinely stuck suite.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system -r requirements.txt
          uv pip install --system -r requirements-dev.txt
          # Trigger the sqlparse MAX_GROUPING_TOKENS auto-patch (see
          # planalign_orchestrator.sqlparse_config) so dbt subprocesses in
          # this job don't hit sqlparse's 10,000-token DoS-protection limit.
          python -c "import planalign_orchestrator"

      - name: Install dbt packages
        run: |
          cd dbt
          dbt deps

      - name: Run multi-year invariant suite
        env:
          # This sentinel exposes tests that bypass their isolated database.
          # The assertion below must remain so the guard stays non-vacuous.
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-multi-year-invariants.duckdb
        run: |
          mkdir -p var/test-artifacts/113
          set -o pipefail
          pytest -m multi_year_invariants -v 2>&1 | tee var/test-artifacts/113/diagnostics.log

      - name: Assert default database sentinel remains unused
        if: always()
        env:
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-multi-year-invariants.duckdb
        run: |
          if [ -e "$DATABASE_PATH" ]; then
            echo "::error::A test reached the global/default database path: $DATABASE_PATH"
            echo "This runner.temp sentinel must remain absent; tests must use explicit isolated databases."
            echo "Likely cause: code fell back to get_database_path() instead of a test fixture database."
            echo "See CLAUDE.md §8 (validate in isolated databases) and tests/conftest.py's shared_dev_database_guard."
            exit 1
          fi

      - name: Preserve failed invariant databases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multi-year-invariants
          path: var/test-artifacts/113/
          retention-days: 7

  edge-config-matrix:
    runs-on: ubuntu-latest
    needs: ci-scope
    if: needs.ci-scope.outputs.simulation == 'true'
    # Four sequential two-year simulations. Each costs ~105s on a GitHub runner
    # (~2x a dev laptop), so the suite needs ~8min wall including setup.
    # Matches multi-year-invariants, the sibling job that also runs real sims.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -c "import planalign_orchestrator"
      - name: Install dbt packages
        run: cd dbt && dbt deps
      - name: Run edge configuration matrix
        env:
          # This sentinel exposes tests that bypass their isolated database.
          # The assertion below must remain so the guard stays non-vacuous.
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-edge-config-matrix.duckdb
        run: |
          mkdir -p var/test-artifacts/124
          set -o pipefail
          pytest -m edge_config_matrix -v --durations=10 2>&1 | tee var/test-artifacts/124/diagnostics.log

      - name: Assert default database sentinel remains unused
        if: always()
        env:
          DATABASE_PATH: ${{ runner.temp }}/planalign-ci-edge-config-matrix.duckdb
        run: |
          if [ -e "$DATABASE_PATH" ]; then
            echo "::error::A test reached the global/default database path: $DATABASE_PATH"
            echo "This runner.temp sentinel must remain absent; tests must use explicit isolated databases."
            echo "Likely cause: code fell back to get_database_path() instead of a test fixture database."
            echo "See CLAUDE.md §8 (validate in isolated databases) and tests/conftest.py's shared_dev_database_guard."
            exit 1
          fi
      - name: Preserve failed matrix artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: edge-config-matrix
          path: var/test-artifacts/124/
          retention-days: 7

  validate-models:
    runs-on: ubuntu-latest
    env:
      DATABASE_PATH: ${{ runner.temp }}/planalign-ci-model-validation.duckdb
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dbt
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system -e .
          python scripts/check_dbt_versions.py
          # Trigger the sqlparse MAX_GROUPING_TOKENS auto-patch (see
          # planalign_orchestrator.sqlparse_config) so dbt subprocesses in
          # this job don't hit sqlparse's 10,000-token DoS-protection limit.
          python -c "import planalign_orchestrator"

      - name: Validate dbt project
        run: |
          cd dbt
          dbt deps
          # Band macros read seed tables at compile time (run_query), so
          # seeds must be loaded before parse/compile.
          dbt seed --profiles-dir . --threads 1
          dbt parse --profiles-dir .
          dbt compile --profiles-dir .

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [ci-scope, lint, studio, fast-tests, python-dependency-audit, validate-models, test, coverage, multi-year-invariants, edge-config-matrix]
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_policy.py gate
