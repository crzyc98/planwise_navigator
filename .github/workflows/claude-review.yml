name: Claude Code Review

# Reviews every same-repo PR for bugs, guided by REVIEW.md. Findings are inline
# comments; branch rules require resolving them before merge. Re-reviews look
# only at commits since the last review and stop after three rounds.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork and Dependabot PRs get no secrets, so skip them.
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            BASE: origin/${{ github.event.pull_request.base.ref }}

            Review this PR for bugs. Read CLAUDE.md, dbt/CLAUDE.md and REVIEW.md first and follow REVIEW.md exactly.

            1. Find earlier rounds: `gh pr view <PR> --json comments` and look for comments containing
               `<!-- claude-review round=N sha=SHA -->`. If round 3 already exists, post one PR comment saying the
               review has gone three rounds and asking the author to reconsider the approach, then stop.
            2. Scope: on round 1, review `git diff BASE...HEAD`. On later rounds, review only
               `git diff <last reviewed sha>..HEAD`, and don't repeat findings already posted on the PR
               (`gh pr view <PR> --comments`, `gh api repos/<REPO>/pulls/<PR>/comments`).
            3. Launch three subagents in parallel with the Agent tool. Give each the diff command, the PR description,
               REVIEW.md and one lens. Each reads the diff and the code around it (callers, consumers, validators,
               schemas) and returns candidate bugs with file, line and a concrete input that breaks.
               - Lens A, contracts between layers: what one layer accepts, produces or defaults vs. what the layers it
                 talks to (Studio UI, API, config export, orchestrator, dbt) accept or expect. Limits, units, nulls, IDs.
               - Lens B, data edge cases and time: empty, missing or null rows; missing or partial years; mid-year
                 events; first and last simulation year; databases or saved workspaces created before this change.
               - Lens C, intent: does every code path do what the PR description claims? What did the old code do
                 that the new code no longer does? For fixes, is the root cause fixed or only one symptom?
               `scripts/review_eval.py --prompt deep` scores this setup; change both together.
            4. Merge duplicates. Re-read the code for each candidate and confirm the failure scenario is real.
               Drop anything you can't tie to a specific line and input. Tag severity using REVIEW.md.
            5. Post each **Important** finding as an inline comment with mcp__github_inline_comment__create_inline_comment.
               Inline threads block merge, so nothing else goes inline.
            6. Post one summary with `gh pr comment`. Start with the count (or "No issues found"). List Nit and
               Pre-existing findings there with `file:line`. On round 2 or later, if `git diff --shortstat BASE...HEAD`
               shows the PR has roughly doubled since round 1, say so and ask whether the growth is in scope.
               End with `Blocking: yes` or `Blocking: no`, then `<!-- claude-review round=N sha=HEAD SHA lines=L -->`,
               where N is this round's number and L is the PR's changed-line count now (read round 1's L from its marker).
          claude_args: |
            --model opus
            --allowedTools "Agent,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
