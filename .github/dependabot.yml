version: 2
updates:
  - package-ecosystem: npm
    directory: /planalign_studio
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # openapi-typescript 7.x peers typescript@^5; TS 7 fails npm ci (#710).
      # Lift once openapi-typescript supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Excludes the intentionally-pinned engine packages (SECURITY.md
      # "Dependencies & Supply Chain") so a dbt/DuckDB/Pydantic bump never
      # rides along in an otherwise-routine grouped PR. Each still gets its
      # own individual Dependabot PR for any update type -- it's isolated,
      # not silenced -- so it gets deliberate review and, per CLAUDE.md,
      # simulation-parity validation before merge (#705).
      python-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "duckdb"
          - "dbt-core"
          - "dbt-duckdb"
          - "pydantic"
          - "fastapi"
        update-types:
          - minor
          - patch
    ignore:
      # ruff 0.4 -> 0.16 surfaces ~4.8k new lint errors (#718); upgrade it
      # deliberately alongside the cleanup rather than via Dependabot.
      - dependency-name: "ruff"
