# Simulation configuration
simulation:
  start_year: 2025
  end_year: 2029
  random_seed: 42
  target_growth_rate: 0.03

# Setup configuration for the orchestrator
setup:
  clear_tables: true
  clear_mode: "year"  # Clear year-specific data only, preserve baseline
  clear_table_patterns: ["int_"]  # Only clear intermediate tables, preserve fact tables for multi-year accumulation
  census_parquet_path: "data/census_preprocessed.parquet"
  plan_year_start_date: "2024-01-01"
  plan_year_end_date: "2024-12-31"
  eligibility_waiting_period_days: 30

workforce:
  total_termination_rate: 0.12
  new_hire_termination_rate: 0.25

compensation:
  cola_rate: 0.02
  merit_budget: 0.035

  # Epic E059: Configurable Promotion Compensation Increases
  promotion_compensation:
    # Base (midpoint) increase percentage for promotions (maintains current 20% midpoint)
    base_increase_pct: 0.20  # 20% base increase (current midpoint of 15-25% range)

    # Distribution around the base (creates 15-25% range for backward compatibility)
    distribution_range: 0.05  # ±5% around base (uniform distribution)

    # Safety caps to prevent extreme increases
    max_cap_pct: 0.30        # Maximum 30% increase allowed
    max_cap_amount: 500000   # Maximum $500K increase allowed

    # Distribution type for randomization
    distribution_type: "uniform"  # Options: "uniform", "normal", "deterministic"

    # Level-specific overrides (optional - uncomment and modify as needed)
    # level_overrides:
    #   1: 0.15  # Staff promotions: 15% base (conservative)
    #   2: 0.18  # Manager promotions: 18% base
    #   3: 0.20  # Senior Manager promotions: 20% base (default)
    #   4: 0.25  # Director promotions: 25% base (higher responsibility)
    #   5: 0.30  # VP promotions: 30% base (executive level)

    # Advanced configuration
    advanced:
      # Normal distribution parameters (when distribution_type = "normal")
      normal_std_dev: 0.02  # Standard deviation for normal distribution

      # Market adjustment factors (optional - can be used for scenario testing)
      # market_adjustments:
      #   conservative: 0.85   # 15% reduction for cost-conscious scenarios
      #   baseline: 1.00       # Default multiplier
      #   competitive: 1.15    # 15% increase for competitive markets
      #   aggressive: 1.30     # 30% increase for talent wars

eligibility:
  waiting_period_days: 0  # Days employee must be employed before becoming eligible (0 = immediate, 365 = 1 year)
  # Feature 103: configurable new-hire plan ineligibility (backward-compatible no-op defaults).
  new_hire_ineligible_pct: 0.0          # Fraction (0.0-1.0) of each year's new-hire cohort marked DC-plan ineligible
  new_hire_eligibility_match_census: false  # When true, use the census-observed ineligible rate instead of the literal pct above
  # Future: moved to Epic E026
  # minimum_age: 21
  # minimum_hours_annual: 1000
  # excluded_employee_types: ["intern", "contractor"]
  # entry_date_type: "quarterly"

# Plan eligibility (separate from employer contribution eligibility)
plan_eligibility:
  minimum_age: 21         # Minimum age to participate in the plan

# Epic E023: Enrollment Engine Configuration
enrollment:
  # Auto-enrollment configuration
  auto_enrollment:
    opt_out_rates:
      target: 0.09
      # Relative propensities are normalized across each opt-out candidate cohort.
      multipliers:
        age:
          - {min: 0, multiplier: 1.8}
          - {min: 30, multiplier: 1.1}
          - {min: 45, multiplier: 0.7}
          - {min: 60, multiplier: 0.4}
        income:
          - {min: 0, multiplier: 1.3}
          - {min: 50000, multiplier: 1.0}
          - {min: 100000, multiplier: 0.8}
          - {min: 200000, multiplier: 0.5}
    # Optional plan provision: re-default eligible noncontributors, including opt-outs.
    # Applies in first_year and every interval_years thereafter; normal opt-out applies again.
    # Sweeps include eligible legacy hires regardless of AE scope or cutoff.
    reenrollment_sweep:
      method: enroll_at_default # Or into_aip: 0% starts at one escalation increment
      include_non_contributors: true
      include_below_default: false # Positive rates strictly below the AE default
      include_below_aip_cap: false # Positive rates strictly below the plan AIP cap
      decline_probability: 0.10 # Contributors only; 0% uses the AE opt-out model
      enabled: false
      interval_years: 3  # Integer >= 1
      first_year: null  # Omitted/null means simulation.start_year + interval_years
    enabled: true  # Global auto-enrollment enable/disable toggle
    window_days: 45  # Configurable auto-enrollment window (default 45 days after hire)
    default_deferral_rate: 0.02  # 2% default deferral rate for auto-enrolled participants
    opt_out_grace_period: 30  # Days after auto-enrollment for opt-out without penalty
    scope: "new_hires_only"  # Options: "new_hires_only", "all_eligible_employees"
    hire_date_cutoff: "2020-01-01"  # Auto-enroll employees hired ON OR AFTER this date (includes census + all new hires)

  # Proactive enrollment configuration (voluntary enrollment within auto-enrollment window)
  proactive_enrollment:
    timing_window:
      min_days: 7   # Earliest proactive enrollment (7 days after eligibility)
      max_days: 35  # Latest proactive enrollment (10 days before auto-enrollment deadline)

  # Voluntary enrollment demographics
  voluntary_enrollment:
    # Epic E053: Enhanced demographic-based enrollment probabilities
    base_rates_by_age:
      young: 0.30      # Ages 18-30: 30% base enrollment rate
      mid_career: 0.55 # Ages 31-45: 55% base enrollment rate
      mature: 0.70     # Ages 46-55: 70% base enrollment rate
      senior: 0.80     # Ages 56+: 80% base enrollment rate

    income_multipliers:
      low: 0.70        # <$50k: Lower enrollment (financial constraints)
      moderate: 1.00   # $50k-$100k: Baseline enrollment
      high: 1.15       # $100k-$200k: Higher enrollment
      executive: 1.25  # >$200k: Highest enrollment

    job_level_multipliers:
      individual: 0.90 # Levels 1-2: Individual contributors
      senior: 1.00     # Levels 3-4: Senior individual contributors
      manager: 1.10    # Levels 5-6: Management roles
      executive: 1.20  # Levels 7+: Executive roles

    # Deferral rate selection with match optimization
    deferral_rates:
      demographic_base_rates:
        young_low: 0.03       # Young, low income: 3%
        young_moderate: 0.03  # Young, moderate income: 3%
        young_high: 0.04      # Young, high income: 4%
        young_executive: 0.06 # Young, executive: 6%
        mid_career_low: 0.04
        mid_career_moderate: 0.06
        mid_career_high: 0.08
        mid_career_executive: 0.10
        mature_low: 0.05
        mature_moderate: 0.08
        mature_high: 0.10
        mature_executive: 0.12
        senior_low: 0.06
        senior_moderate: 0.10
        senior_high: 0.12
        senior_executive: 0.15

  # Epic E053: Year-over-year voluntary enrollment for non-participants
  year_over_year_conversion:
    enabled: true  # Enable year-over-year voluntary enrollment
    # Age rates scaled together for about 5% population-average annual conversion.
    # Income and tenure multipliers retain the demographic gradients.
    base_rates_by_age:
      young: 0.0275848
      mid_career: 0.04597466
      mature: 0.06436453
      senior: 0.07355946
    income_multipliers:
      low_income: 0.8  # Financial constraints reduce conversion
      moderate: 1.0    # Baseline conversion rate
      high: 1.2        # Increased financial capacity
      executive: 1.3   # Financial sophistication drives conversion
    tenure_multipliers:
      new_employee: 0.7  # < 2 years: Still adjusting
      established: 1.0   # 2-5 years: Baseline conversion
      veteran: 1.1       # 5+ years: Company loyalty/stability
    deferral_rates:
      young: 0.03         # 3% for young converters
      mid_career: 0.04    # 4% for mid-career converters
      mature: 0.05        # 5% for mature converters
      senior: 0.06        # 6% for senior converters

  # Feature 102: Match-magnet dial for voluntary enrollment. The magnet snaps a
  # fraction of below-ceiling voluntary enrollees up to the employer-match ceiling
  # (the deferral that captures the full match). Defaults below reproduce prior
  # behavior; raise snap_probability to counteract a declining average deferral in
  # plans without auto-enrollment.
  # match_magnet:
  #   enabled: true            # Toggle the defer-to-the-match behavior
  #   snap_probability: 0.45   # Fraction of below-ceiling enrollees who snap to the ceiling (0.0-1.0)
  #   max_deferral_rate: 0.10  # Upper bound on voluntary deferral selection (incl. snapped rates)

  match_magnet:
    # By default, lower eligible self-directed starting rates toward the full-match ceiling.
    # Uses the same probability as the upward match magnet (snap_probability), decimal 0–1.
    downward_enabled: true
  below_default:
    # By default, 10% choose below AE defaults up to 3%; 15% choose below higher defaults.
    # Tier ceilings are decimals (0.06 = 6%); share is the fraction choosing below-default in that tier (0–1).
    # Tiers are ordered by ceiling with one final null ceiling; tier shares are independent, not a distribution.
    share_tiers: [{max_auto_enroll_default_rate: 0.03, share: 0.10}, {max_auto_enroll_default_rate: null, share: 0.15}]
    # pp = whole percentage points below the default; weights must sum to 1 (±1e-6).
    steps: [{pp: 1, weight: 0.50}, {pp: 2, weight: 0.30}, {pp: 3, weight: 0.20}]

# Decimals; match design for YAML/CLI runs. Studio scenarios set their own.
dc_plan:
  match_template: tiered
  match_tiers:
    - {employee_min: 0.00, employee_max: 0.03, match_rate: 1.00}
    - {employee_min: 0.03, employee_max: 0.05, match_rate: 0.50}
  match_cap_percent: 0.04

# Employer match configuration
employer_match:
  # Epic E058: Employer match eligibility configuration
  # Epic E061: Enable eligibility enforcement to fix new hire termination match issue
  apply_eligibility: true  # Enable sophisticated eligibility enforcement (was false for backward compatibility)

  # Match eligibility requirements (independent from core eligibility)
  # Epic E061: Configure to exclude new hire terminations from match
  eligibility:
    minimum_tenure_years: 0        # Minimum years of service (default: 0 for immediate match eligibility)
    require_active_at_year_end: true  # Must be active on Dec 31 (excludes year-of-hire terminations)
    minimum_hours_annual: 1000     # Minimum hours worked (default: 1000)
    allow_new_hires: true          # Allow active new hires to qualify (tenure exception)
    allow_terminated_new_hires: false  # Exclude new-hire terminations from match eligibility
    allow_experienced_terminations: false  # Exclude experienced terminations from match eligibility

  # E046: Match calculation mode (overrides deferral-based dc_plan match tiers)
  # Set employer_match_status to switch modes:
  #   'deferral_based' (default) - uses dc_plan.match_tiers
  #   'graded_by_service' - uses employer_match_graded_schedule
  #   'tenure_based' - uses tenure_match_tiers below
  #   'points_based' - uses points_match_tiers below (points = FLOOR(age) + FLOOR(tenure))
  # employer_match_status: 'deferral_based'

  # E046: Tenure-based match tiers (used when employer_match_status: 'tenure_based')
  # Match rate varies by employee years of service using [min, max) intervals
  # tenure_match_tiers:
  #   - min_years: 0
  #     max_years: 2
  #     match_rate: 25          # 25% match rate
  #     max_deferral_pct: 6     # Match on up to 6% deferral
  #   - min_years: 2
  #     max_years: 5
  #     match_rate: 50          # 50% match rate
  #     max_deferral_pct: 6
  #   - min_years: 5
  #     max_years: 10
  #     match_rate: 75          # 75% match rate
  #     max_deferral_pct: 6
  #   - min_years: 10
  #     max_years: null         # Unbounded (10+ years)
  #     match_rate: 100         # 100% match rate
  #     max_deferral_pct: 6

  # E046: Points-based match tiers (used when employer_match_status: 'points_based')
  # Points = FLOOR(current_age) + FLOOR(years_of_service)
  # Match rate varies by point total using [min, max) intervals
  # points_match_tiers:
  #   - min_points: 0
  #     max_points: 40
  #     match_rate: 25          # 25% match for points 0-39
  #     max_deferral_pct: 6
  #   - min_points: 40
  #     max_points: 60
  #     match_rate: 50          # 50% match for points 40-59
  #     max_deferral_pct: 6
  #   - min_points: 60
  #     max_points: 80
  #     match_rate: 75          # 75% match for points 60-79
  #     max_deferral_pct: 6
  #   - min_points: 80
  #     max_points: null        # Unbounded (80+ points)
  #     match_rate: 100         # 100% match for 80+ points
  #     max_deferral_pct: 6

# Employer core (non-elective) contribution configuration
employer_core_contribution:
  enabled: true                    # Master on/off switch
  contribution_rate: 0.01         # Flat core contribution rate (used when status is 'flat')

  # Epic E084: Core contribution status/type
  status: 'flat'  # Options: 'none', 'flat', 'graded_by_service', 'points_based', 'age_banded'

  # Epic E084: Graded core contribution schedule (used when status is 'graded_by_service')
  # Rate increases with years of service
  graded_schedule:
    - service_years_min: 0
      service_years_max: 2
      contribution_rate: 0.01    # 1% for 0-2 years
    - service_years_min: 3
      service_years_max: 5
      contribution_rate: 0.02    # 2% for 3-5 years
    - service_years_min: 6
      service_years_max: null    # null = unlimited
      contribution_rate: 0.03    # 3% for 6+ years

  # Age-banded schedule (used when status is 'age_banded'). Rates are decimal
  # fractions and tiers must cover [0, infinity) with [min_age, max_age) bounds.
  # age_schedule:
  #   - min_age: 0
  #     max_age: 30
  #     contribution_rate: 0.03
  #   - min_age: 30
  #     max_age: null
  #     contribution_rate: 0.06

  # Social Security integrated (permitted-disparity) modifier. This does not
  # replace the status above: the status resolves the base rate and integration
  # adds disparity_rate to recognized compensation above the resolved level.
  integration:
    enabled: false
    # ss_wage_base | percent_of_ss_wage_base | fixed_dollar
    level_mode: 'ss_wage_base'
    # Required for percent_of_ss_wage_base (0-100) and fixed_dollar (>0).
    # level_value: null
    # Decimal fraction: 0.027 represents an additional 2.7%.
    disparity_rate: 0.0

  # Eligibility requirements (dbt variables for int_employer_eligibility.sql)
  eligibility:
    minimum_tenure_years: 0        # Minimum years of service (default: 1 year)
    require_active_at_year_end: true  # Must be active on Dec 31 (default: true)
    minimum_hours_annual: 1000     # Minimum hours worked (default: 1000)
    allow_new_hires: true          # Allow new hires to qualify (tenure exception)
    allow_terminated_new_hires: false  # Allow new-hire terminations to qualify when enabled
    allow_experienced_terminations: false  # Allow experienced terminations to qualify when enabled

# Performance optimization configuration
optimization:
  # Epic E068C: Threading and parallelization configuration
  e068c_threading:
    dbt_threads: 1  # Number of threads for dbt execution (1-16) - REVERTED: threading added 34s overhead
    event_shards: 1  # Optional sharding for event generation (1-8)
    max_parallel_years: 1  # Sequential year processing for determinism (1-5)

# Navigator Orchestrator configuration
orchestrator:
  # Epic E067: Multi-Threading Support - dbt Threading Configuration
  threading:
    enabled: false  # Enable configurable threading support

    # Epic E067 Story S067-02: Model-Level Parallelization Configuration
    parallelization:
      enabled: false  # Enable model-level parallelization for performance
      max_workers: 4  # Maximum parallel workers for model execution
      enable_conditional_parallelization: true  # Allow conditional parallel execution

      # Safety and validation settings
      safety:
        validate_execution_safety: true  # Validate parallelization safety before execution

    # Epic E067 Story S067-03: Advanced Resource Management Configuration
    resource_management:
      # Memory monitoring configuration
      memory_monitoring:
        monitoring_interval_seconds: 5  # Resource check frequency
        history_size: 100  # Resource history buffer size

        # Memory pressure thresholds (MB)
        thresholds:
          moderate_mb: 2048  # 2GB - start resource optimization
          high_mb: 3072      # 3GB - aggressive resource management
          critical_mb: 4096  # 4GB - emergency fallback mode
          gc_trigger_mb: 2560  # 2.5GB - trigger garbage collection

      # CPU monitoring configuration
      cpu_monitoring:
        monitoring_interval_seconds: 5
        history_size: 50

        # CPU utilization thresholds (percentage)
        thresholds:
          moderate_percent: 70  # 70% CPU - start thread optimization
          high_percent: 85      # 85% CPU - reduce thread count
          critical_percent: 95  # 95% CPU - emergency throttling

# Epic E058: Match-Responsive Deferral Adjustments
# When employer match formulas change, employees may adjust their deferral rates
# in response. Fires in the first simulation year only.
deferral_match_response:
  enabled: true                           # Master on/off switch
  upward_participation_rate: 0.40         # 40% of below-max employees respond upward
  upward_maximize_rate: 0.60              # 60% of upward responders jump to match-maximizing rate
  upward_partial_increase_rate: 0.40      # 40% of upward responders partially increase
  upward_partial_increase_factor: 0.50    # Close 50% of the gap for partial responders
  downward_enabled: true                  # Enable downward adjustments
  downward_participation_rate: 0.15       # 15% of above-max employees respond downward
  downward_reduce_to_max_rate: 0.70       # 70% of downward responders reduce to match-maximizing rate
  downward_partial_decrease_rate: 0.30    # 30% of downward responders partially decrease
  downward_partial_decrease_factor: 0.50  # Close 50% of the gap for partial decreasers
  effective_timing: "first_year"          # Only fires in the first simulation year

# Epic E035: Automatic Annual Deferral Rate Escalation Configuration (Simplified)
deferral_auto_escalation:
  # Escalation is the auto-increase program (AIP).
  # Increase enrolled participants' deferrals annually; automatic mode preserves existing behavior.
  # Rates are decimals (0.06 = 6%); signup uses a stable per-participant probability, 0–1.
  enabled: true                 # Master on/off switch
  mode: automatic               # automatic | participant_elected; only applies when enabled
  participant_elected_signup_probability: 0.01  # 1% sign up outside Easy Enroll in participant-elected mode
  effective_day: "01-01"        # MM-DD for escalation effective date
  increment_amount: 0.01        # Annual escalation rate (default 1%)
  maximum_rate: 0.10            # Cap for deferral rate (default 10%)
  hire_date_cutoff: "2020-01-01"        # Optional YYYY-MM-DD; Only escalate employees hired ON OR AFTER this date
  require_active_enrollment: true  # Only escalate enrolled participants
  first_escalation_delay_years: 1  # Years to wait after enrollment before first escalation (default 1)

# Run and artifact retention configuration
storage:
  max_runs_per_scenario: 3  # Maximum archived runs to keep per scenario (0 = unlimited)
  artifact_max_age_days: 14  # `planalign gc` reclaims var/ campaign DBs older than this

# Offer preset deferral packages by default during self-directed enrollment.
# Rates are decimals (0.06 = 6%); shares are fractions, 0–1.
easy_enroll:
  enabled: true
  # Share of employees who enroll on their own (before any auto-enrollment) who use
  # Easy Enroll instead of choosing a rate themselves; the remainder enroll proactively online.
  # Use the share for whether the plan has auto-enrollment. Easy Enroll is only available
  # before auto-enrollment happens; auto-enrolled participants never use it.
  # Without auto-enrollment: ~45% Easy Enroll / 55% proactive.
  # With auto-enrollment: ~20% Easy Enroll / 15% proactive / 65% auto-enrolled,
  # so 20/35 ≈ 0.57 of employees who enroll on their own use Easy Enroll.
  channel_share_without_auto_enrollment: 0.45
  channel_share_with_auto_enrollment: 0.57
  packages:  # Ordered rate/share distribution; shares must sum to 1 (±1e-6)
    - {rate: 0.06, share: 0.30}
    - {rate: 0.08, share: 0.50}
    - {rate: 0.10, share: 0.20}
  escalation_cap: 0.10  # Maximum deferral rate under escalation for package participants (10%)

# Model voluntary deferral increases, decreases, stops and restarts by default.
# All probabilities are per participant per year, 0–1; 0.03 = 3%.
deferral_rate_changes:
  enabled: true
  with_escalation: {increase_probability: 0.03, decrease_probability: 0.03}  # Annual participant probabilities; decrease set to 3% by the plan owner (2026-10-27)
  without_escalation: {increase_probability: 0.25, decrease_probability: 0.075}  # Annual participant probabilities
  # Probability = base x age x income x tenure for each direction. Stop is unchanged.
  # If increase + decrease + stop > 1, scale increase/decrease proportionally to 1 - stop.
  # Ordered inclusive lower bounds: age/tenure in years, income in annual dollars.
  # First min must be 0; final band is open-ended.
  # Fitted to internal plan statistics: shapes only, normalized so the population average is about 1.
  multipliers:
    increase:
      age: [{min: 0, multiplier: 0.8}, {min: 30, multiplier: 0.95}, {min: 40, multiplier: 1.05}, {min: 50, multiplier: 1.25}, {min: 60, multiplier: 1.3}, {min: 70, multiplier: 0.8}]
      income: [{min: 0, multiplier: 0.5}, {min: 25000, multiplier: 0.65}, {min: 50000, multiplier: 0.75}, {min: 60000, multiplier: 0.9}, {min: 75000, multiplier: 1.0}, {min: 100000, multiplier: 1.15}, {min: 125000, multiplier: 1.2}, {min: 150000, multiplier: 1.35}, {min: 200000, multiplier: 1.3}, {min: 250000, multiplier: 1.2}]
      tenure: [{min: 0, multiplier: 1.05}, {min: 2, multiplier: 0.9}, {min: 5, multiplier: 0.95}, {min: 10, multiplier: 1.1}, {min: 15, multiplier: 1.15}, {min: 20, multiplier: 1.2}, {min: 25, multiplier: 1.25}, {min: 30, multiplier: 1.15}]
    decrease:
      age: [{min: 0, multiplier: 0.95}, {min: 30, multiplier: 1.1}, {min: 40, multiplier: 1.0}, {min: 50, multiplier: 0.85}, {min: 60, multiplier: 0.75}, {min: 70, multiplier: 0.5}]
      income: [{min: 0, multiplier: 0.5}, {min: 25000, multiplier: 0.65}, {min: 40000, multiplier: 0.6}, {min: 50000, multiplier: 0.75}, {min: 60000, multiplier: 0.85}, {min: 75000, multiplier: 0.95}, {min: 100000, multiplier: 1.05}, {min: 125000, multiplier: 1.25}, {min: 150000, multiplier: 1.4}, {min: 200000, multiplier: 1.55}, {min: 250000, multiplier: 1.25}]
      tenure: [{min: 0, multiplier: 0.9}, {min: 2, multiplier: 0.95}, {min: 3, multiplier: 1.05}, {min: 4, multiplier: 1.1}, {min: 5, multiplier: 1.05}, {min: 15, multiplier: 1.0}, {min: 20, multiplier: 0.9}, {min: 25, multiplier: 0.85}, {min: 30, multiplier: 0.75}]
  # pp = whole percentage points of deferral change; each list's weights must sum to 1 (±1e-6).
  increase_steps: [{pp: 1, weight: 0.10}, {pp: 2, weight: 0.10}, {pp: 3, weight: 0.15}, {pp: 5, weight: 0.20}, {pp: 7, weight: 0.20}, {pp: 10, weight: 0.25}]
  decrease_steps: [{pp: 1, weight: 0.10}, {pp: 2, weight: 0.15}, {pp: 3, weight: 0.15}, {pp: 5, weight: 0.20}, {pp: 8, weight: 0.20}, {pp: 12, weight: 0.20}]
  post_escalation_decrease_window_days: 90  # Non-negative days after escalation
  post_escalation_decrease_leaves_escalation: false  # Remain in the auto-increase program after a decrease
  stop_probability: 0.015  # Annual probability of stopping contributions
  restart_probability: 0.40  # Annual chance a stopped participant restarts; ~2/3 of stops restart, net of turnover
