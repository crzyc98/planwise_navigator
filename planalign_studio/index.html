<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>PlanAlign Engine</title>
    <script>
      (() => {
        const storageKey = 'planalign.theme.v1';
        const systemQuery = '(prefers-color-scheme: dark)';
        let preference = null;
        try {
          const stored = window.localStorage.getItem(storageKey);
          preference = stored === 'light' || stored === 'dark' ? stored : null;
        } catch {
          preference = null;
        }
        const theme = preference ?? (window.matchMedia(systemQuery).matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <!-- Google Fonts: SRI not applicable (response varies by user-agent) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
