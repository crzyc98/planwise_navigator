version: 2

models:
  - name: int_eligibility_events
    description: >
      DC plan eligibility events (Feature 086). Generates one eligibility event per
      employee per simulation when they first satisfy all plan participation requirements
      (minimum age AND waiting period). Covers both census employees and new hires.
      Uses incremental self-reference to emit only new eligibility transitions — no
      duplicate events across multi-year simulations.
    config:
      tags: ["EVENT_GENERATION", "eligibility"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - employee_id
              - simulation_year
          config:
            severity: error
            error_if: ">= 1"
    columns:
      - name: employee_id
        description: Unique employee identifier
        data_tests:
          - not_null
      - name: event_type
        description: Event type (always 'eligibility')
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['eligibility']
      - name: simulation_year
        description: Simulation year in which eligibility was first achieved
        data_tests:
          - not_null
      - name: effective_date
        description: >
          Exact computed eligibility date: GREATEST(hire_date + waiting_period_days,
          age_threshold_jan1). Never NULL for eligible employees.
        data_tests:
          - not_null
      - name: event_category
        description: Event category (always 'eligibility')
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['eligibility']
      - name: event_probability
        description: Always 1.0 — eligibility determination is deterministic
        data_tests:
          - not_null

  - name: int_synthetic_baseline_enrollment_events
    description: >
      Synthetic baseline enrollment events generated from census data for Epic E049.
      Creates audit trail events for all pre-enrolled census participants to maintain
      complete event-sourcing architecture while preserving actual deferral rates.
    config:
      tags: ["enrollment", "census_integration", "epic_e049", "event_sourcing"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - employee_id
              - simulation_year
          config:
            severity: error
            error_if: ">= 1"
    columns:
      - name: employee_id
        description: Unique employee identifier from census data
        data_tests:
          - not_null
          - unique:
              config:
                severity: error
                where: "simulation_year = {{ var('start_year', 2025) }}"
      - name: event_type
        description: Event type (always 'enrollment' for synthetic baseline events)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['enrollment']
      - name: simulation_year
        description: Simulation year (should match start_year for baseline events)
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "{{ var('simulation_start_year', 2025) }}"
                max_value: "{{ var('simulation_end_year', 2029) }}"
      - name: effective_date
        description: Historical enrollment date from census data
        data_tests:
          - not_null
      - name: employee_deferral_rate
        description: Preserved census deferral rate (normalized to [0,1])
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.0
                max_value: 1.0
                inclusive: true
      - name: event_details
        description: Human-readable event description with actual deferral rate
        data_tests:
          - not_null
      - name: data_quality_flag
        description: Data quality classification for rate source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['census_rate_preserved', 'capped_at_irs_limit', 'fallback_rate_applied']
      - name: has_valid_rate
        description: Boolean flag indicating valid deferral rate
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_pre_simulation_enrollment
        description: Boolean flag confirming enrollment occurred before simulation start
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: int_deferral_match_response_events
    description: >
      Match-responsive deferral adjustment events (Epic E058).
      Generates events when employees adjust deferrals in response to the
      match formula gap. Fires in the first simulation year only.
      Upward responses can reach the full-match contribution rate independently
      of the annual auto-escalation cap, subject to the IRS rate-equivalent limit.
    config:
      tags: ["EVENT_GENERATION", "E058_MATCH_RESPONSE"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - employee_id
              - simulation_year
          config:
            severity: error
            error_if: ">= 1"
    columns:
      - name: employee_id
        description: Unique employee identifier
        data_tests:
          - not_null
      - name: event_type
        description: Event type (always 'deferral_match_response')
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['deferral_match_response']
      - name: employee_deferral_rate
        description: New deferral rate after match-responsive adjustment
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.0
                max_value: 1.0
                inclusive: true

  - name: int_deferral_change_events
    description: Enabled by default. Continuous participants may increase, decrease, or stop once per year; enrolled prior stoppers may restart with 5% annual probability. Changes follow all other rate events.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [employee_id, simulation_year]
    columns:
      - name: employee_id
        data_type: VARCHAR
        data_tests:
          - not_null
      - name: employee_ssn
        data_type: VARCHAR
      - name: event_type
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['deferral_change']
      - name: simulation_year
        data_type: INTEGER
        data_tests:
          - not_null
      - name: effective_date
        data_type: DATE
        data_tests:
          - not_null
      - name: event_details
        data_type: VARCHAR
      - name: compensation_amount
        data_type: DECIMAL(15,2)
      - name: previous_compensation
        data_type: DECIMAL(15,2)
      - name: employee_deferral_rate
        data_type: DECIMAL(5,4)
      - name: prev_employee_deferral_rate
        description: Canonical rate after sweep override of earlier escalation and match-response events.
        data_type: DECIMAL(5,4)
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: employee_age
        data_type: SMALLINT
      - name: employee_tenure
        data_type: DECIMAL(10,2)
      - name: level_id
        data_type: SMALLINT
      - name: age_band
        data_type: VARCHAR
      - name: tenure_band
        data_type: VARCHAR
      - name: event_probability
        description: Direction probability after age, income and tenure multipliers and proportional rescaling; stop and restart retain their own probabilities.
        data_type: DECIMAL(5,4)
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: event_category
        data_type: VARCHAR
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['proactive_increase', 'proactive_decrease', 'aip_response_decrease', 'stop', 'restart']
