        description: Internal employee identifier used only within simulation processing
        data_tests: [not_null]
      - name: simulation_year
        description: Current generator year
        data_tests: [not_null]
      - name: termination_date
        description: Earliest effective termination date across both source cohorts
        data_tests: [not_null]
      - name: termination_cohort
        description: Source selected for the earliest boundary
        data_tests:
          - not_null
          - accepted_values:
              values: ['experienced', 'new_hire']

  # int_merit_events and int_promotion_events are ephemeral models (E068A optimization)
  # and cannot be tested directly. Data quality validation occurs at fct_yearly_events level.

  - name: int_new_hire_termination_events
    description: >
      Termination events for employees hired in the same simulation year.
      Applies higher turnover rates to new hires for realistic modeling.
    config:
      tags: ["event_sourcing"]
    columns:
