version: 2

models:
  - name: int_current_year_events
    description: >
      Ephemeral, SQL-first assembly boundary for the complete current-year event
      candidate set. Durable publication is owned only by fct_yearly_events.
    config:
      tags: ["EVENT_GENERATION", "event_sourcing", "contract"]
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "simulation_year = {{ var('simulation_year', 2025) }}"
    columns:
      - name: event_id
        data_type: varchar
        data_tests: [not_null]
      - name: scenario_id
        data_type: varchar
        data_tests: [not_null]
      - name: plan_design_id
        data_type: varchar
        data_tests: [not_null]
      - name: employee_id
        data_type: varchar
        data_tests: [not_null]
      - name: simulation_year
        data_type: integer
        data_tests: [not_null]
      - name: event_sequence
        data_type: bigint
        data_tests: [not_null]

  - name: int_workforce_state_accumulator
    description: >
      Authoritative workforce-only state derived from the prior accumulator year
      and current immutable workforce events. Benefit-domain state is excluded.
    config:
      tags: ["STATE_ACCUMULATION", "DOMAIN_STATE", "contract"]
    data_tests:
      - unique:
          column_name: "scenario_id || '_' || plan_design_id || '_' || employee_id || '_' || simulation_year"
          name: "unique_workforce_state_per_scope_employee_year"
    columns:
      - name: scenario_id
        data_type: varchar
        data_tests: [not_null]
      - name: plan_design_id
        data_type: varchar
        data_tests: [not_null]
      - name: employee_id
        data_type: varchar
        data_tests: [not_null]
      - name: simulation_year
        data_type: integer
        data_tests: [not_null]
      - name: employee_ssn
        data_type: varchar
        data_tests: [not_null]
      - name: employee_birth_date
        data_type: timestamp
      - name: employee_hire_date
        data_type: timestamp
        data_tests: [not_null]
      - name: termination_date
        data_type: timestamp
      - name: termination_reason
        data_type: varchar
      - name: employment_status
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              values: ["active", "terminated"]
      - name: detailed_status_code
        data_type: varchar
        data_tests: [not_null]
      - name: current_compensation
        data_type: double
        data_tests: [not_null]
      - name: prorated_annual_compensation
        data_type: double
        data_tests: [not_null]
      - name: full_year_equivalent_compensation
        data_type: double
        data_tests: [not_null]
      - name: current_age
        data_type: bigint
        data_tests: [not_null]
      - name: current_tenure
        data_type: integer
        data_tests: [not_null]
      - name: level_id
        data_type: integer
        data_tests: [not_null]
      - name: age_band
        data_type: varchar
      - name: tenure_band
        data_type: varchar
      - name: scheduled_hours_per_week
        data_type: decimal(5,2)

  - name: int_employer_eligibility
    description: >
      MVP employer contribution eligibility determination model.
      Enhanced with Epic E058: Employer Match Eligibility Configuration.
      Implements sophisticated eligibility logic for both match and core contributions
      with configurable business rules and backward compatibility. Eligibility service
      is copied exactly from the current-year workforce accumulator; no benefit model
      reconstructs service from a prior-year row.
    config:
      tags: ["employer_contributions", "eligibility", "foundation", "e058"]
    columns:
      - name: employee_id
        description: Unique employee identifier
        data_tests:
          - not_null
          # No relationship test to int_baseline_workforce by design:
          # eligibility includes new hires generated during simulation who are not in the baseline
      - name: simulation_year
        description: Simulation year for eligibility determination
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: "{{ var('simulation_start_year', 2025) }}"
              max_value: "{{ var('simulation_end_year', 2029) }}"
      - name: employment_status
        description: Current employment status
        data_tests:
          - not_null
          - accepted_values:
              values: ['active', 'terminated']
      - name: annual_hours_worked
        description: Annual hours worked (2080 for active, 0 for terminated)
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 3000
      - name: eligible_for_contributions
        description: Combined eligibility flag for employer contributions
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: eligible_for_match
        description: "Epic E058 Phase 1: Eligibility flag for employer match contributions with configurable rules"
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: match_eligibility_reason
        description: "Epic E058 Phase 1: Reason code for match eligibility determination"
        data_tests:
          - not_null
          - accepted_values:
              values: ['eligible', 'insufficient_hours', 'insufficient_tenure', 'inactive_eoy', 'backward_compatibility_simple_rule']
      - name: eligible_for_core
        description: Eligibility flag for employer core contributions
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: current_tenure
        description: >
          Authoritative completed years of service copied exactly from
          int_workforce_state_accumulator.current_tenure for the same employee and
          simulation year. Terminated employees use service through termination_date.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 60
      - name: eligibility_method
        description: "Epic E058 Phase 1: Method used for eligibility determination"
        data_tests:
          - not_null
          - accepted_values:
              values: ['backward_compatibility', 'configured_rules', 'prorated_hours_with_tenure']
      - name: match_apply_eligibility
        description: "Epic E058 Phase 1: Configuration flag indicating whether eligibility rules are applied"
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: match_tenure_requirement
        description: "Epic E058 Phase 1: Minimum tenure requirement in years for match eligibility"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 10
      - name: match_hours_requirement
        description: "Epic E058 Phase 1: Minimum hours requirement for match eligibility"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 2500
      - name: match_requires_active_eoy
        description: "Epic E058 Phase 1: Configuration flag requiring active employment at end of year"
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: match_allow_new_hires
        description: "Epic E058 Phase 1: Configuration flag allowing new hires to be eligible"
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: match_allow_terminated_new_hires
        description: "Epic E058 Phase 1: Configuration flag allowing terminated new hires to be eligible"
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: match_allow_experienced_terminations
        description: "Epic E058 Phase 1: Configuration flag allowing experienced terminated employees to be eligible"
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
    data_tests:
      - unique:
          column_name: "employee_id || '_' || simulation_year"
      - dbt_utils.expression_is_true:
          expression: "employment_status = 'active' OR (employment_status != 'active' AND NOT eligible_for_contributions)"
          config:
            severity: error
      - dbt_utils.expression_is_true:
          expression: "annual_hours_worked >= 1000 OR NOT eligible_for_contributions"
          config:
            severity: error
      # Epic E058 Phase 4: Match eligibility reason consistency validated via
      # singular test: tests/data_quality/test_e058_match_eligibility_consistency.sql
      - dbt_utils.expression_is_true:
          name: "e058_backward_compatibility_logic"
          expression: >
            (match_apply_eligibility = false AND match_eligibility_reason = 'backward_compatibility_simple_rule') OR
            (match_apply_eligibility = true AND match_eligibility_reason != 'backward_compatibility_simple_rule')
          config:
            severity: error
            error_if: ">= 1"
      - dbt_utils.expression_is_true:
          name: "e058_tenure_requirement_consistency"
          expression: >
            (match_eligibility_reason = 'insufficient_tenure' AND current_tenure < match_tenure_requirement) OR
            (match_eligibility_reason != 'insufficient_tenure')
          config:
            severity: error
            error_if: ">= 1"
      - dbt_utils.expression_is_true:
          name: "e058_hours_requirement_consistency"
          expression: >
            (match_eligibility_reason = 'insufficient_hours' AND annual_hours_worked < match_hours_requirement) OR
            (match_eligibility_reason != 'insufficient_hours')
          config:
            severity: error
            error_if: ">= 1"
      - dbt_utils.expression_is_true:
          name: "e058_active_eoy_requirement_consistency"
          expression: >
            (match_eligibility_reason = 'inactive_eoy' AND match_requires_active_eoy = true AND employment_status != 'active') OR
            (match_eligibility_reason != 'inactive_eoy')
          config:
            severity: error
            error_if: ">= 1"

  - name: int_employer_core_contributions
    description: >
      Employer core (non-elective) contribution calculation model.
      Supports flat, graded-by-service, points-based, and age-banded configurations.
      When employer_core_status is 'graded_by_service', applies tiered
      rates based on employee years of service. Includes audit trail
      field (applied_years_of_service) for compliance tracking.
      Age-banded schedules use the annual workforce current_age and do not
      depend on reporting age bands.
      Formula family, flat rate, integration settings, and design-keyed graded,
      age, or points schedule resolve from each employee's plan_design_id. The
      pre-dedup guard requires exactly one band for every eligible banded-family
      employee; test_core_rate_band_resolution is the publication-layer net.
    config:
      tags: ["employer_contributions", "core_contributions", "mvp"]
    columns:
      - name: employee_id
        description: Unique employee identifier
        data_tests:
          - not_null
          - relationships:
              to: ref('int_employee_compensation_by_year')
              field: employee_id
              config:
                severity: warn
      - name: simulation_year
        description: Simulation year for contribution calculation
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: "{{ var('simulation_start_year', 2025) }}"
              max_value: "{{ var('simulation_end_year', 2029) }}"
      - name: plan_design_id
        description: Sticky assigned design used to resolve the core rate or schedule.
        data_tests: [not_null]
      - name: employment_status
        description: Employment status used by the core eligibility calculation.
      - name: annual_hours_worked
        description: Annual hours used by the core eligibility calculation.
      - name: eligible_compensation
        description: Compensation used for contribution calculation
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 20000000
      - name: employer_core_amount
        description: Calculated employer core contribution amount
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 400000
      - name: contribution_method
        description: Configured or disabled core-contribution calculation method.
      - name: standard_core_rate
        description: Design-specific flat core rate retained for audit comparison.
      - name: irs_401a17_limit
        description: Annual qualified-plan compensation limit used in the calculation.
      - name: irs_401a17_limit_applied
        description: Whether eligible compensation exceeded the annual limit.
      - name: ss_wage_base
        description: Social Security taxable wage base for the simulation year.
      - name: integration_level_applied
        description: Resolved integration level; null when integration is disabled.
      - name: excess_compensation
        description: Recognized compensation above the integration level.
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 20000000
      - name: base_core_amount
        description: Separately rounded base-rate employer core contribution.
      - name: disparity_core_amount
        description: Separately rounded permitted-disparity contribution.
      - name: core_contribution_rate
        description: >
          Applied contribution rate. For flat mode, uses configured rate.
          For graded_by_service mode, rate varies by years_of_service tier.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0.00
              max_value: 1.00
      - name: applied_years_of_service
        description: >
          Exact integer service basis used for graded-by-service and points-based
          core rate selection. Equals FLOOR of the current-year authoritative
          workforce current_tenure, including termination-date service.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: eligible_for_core
        description: Core contribution eligibility flag
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: created_at
        description: Nondeterministic model-build timestamp; excluded from canonical parity.
      - name: scenario_id
        description: Simulation scenario identifier.
      - name: parameter_scenario_id
        description: Scenario identifier associated with the exported parameter set.
    data_tests:
      - unique:
          column_name: "employee_id || '_' || plan_design_id || '_' || simulation_year"
      - dbt_utils.expression_is_true:
          expression: "eligible_for_core = true OR (eligible_for_core = false AND employer_core_amount = 0)"
          config:
            severity: error
      - dbt_utils.expression_is_true:
          expression: "eligible_compensation > 0 OR employer_core_amount = 0"
          config:
            severity: error
      - dbt_utils.expression_is_true:
          expression: "ABS(employer_core_amount - (eligible_compensation * core_contribution_rate)) < 0.01"
          config:
            severity: warn

  - name: int_employee_match_calculations
    description: >
      Employer match calculation model supporting configurable formulas including
      simple percentage match, tiered match, and safe harbor formulas.
      Enhanced with Epic E058 Phase 2: Match Calculation Integration for eligibility filtering.
      Integrates with employee contributions and eligibility determination to calculate match amounts.
      Formula family, descriptive template, tiers, rates, and caps resolve by
      each employee's sticky plan_design_id. Referenced family arms alone are
      compiled, and a pre-publication exactly-one guard prevents gaps or overlaps;
      test_match_formula_arm_coverage is the publication-layer net.
    config:
      tags: ["match_engine", "critical", "core_calculation", "e058"]
    columns:
      - name: employee_id
        description: Unique employee identifier
        data_tests:
          - not_null
      - name: simulation_year
        description: Simulation year for match calculations
        data_tests:
          - not_null
      - name: eligible_compensation
        description: Contribution-basis compensation after applicable windowing.
      - name: annual_deferrals
        description: Employee deferrals used by the selected match formula.
      - name: plan_design_id
        description: Sticky assigned design used to resolve match tiers and caps.
        data_tests: [not_null]
      - name: employer_match_amount
        description: Calculated employer match amount after caps and eligibility filtering
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 50000
      - name: deferral_rate
        description: Employee deferral rate used for match calculation
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1.0
      - name: match_cap_applied
        description: Whether the match cap was applied (before eligibility filtering)
        data_tests:
          - not_null
      - name: formula_type
        description: >
          Type of match formula applied.
          E010: Added graded_by_service for service-based matching.
        data_tests:
          - not_null
          - accepted_values:
              values: ["simple", "tiered", "none", "graded_by_service", "points_based", "tenure_graded"]
      - name: formula_id
        description: Stable identifier derived from the design's descriptive match template.
      - name: formula_name
        description: Human-readable name derived from the match template.
      - name: applied_points
        description: Age-plus-service points used by points-based matching; null otherwise.
      - name: irs_401a17_limit
        description: Annual qualified-plan compensation limit used in the calculation.
      - name: irs_401a17_limit_applied
        description: Whether eligible compensation exceeded the annual limit.
      - name: effective_match_rate
        description: Actual match rate after caps and eligibility
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1.5
      - name: is_eligible_for_match
        description: "Epic E058 Phase 2: Match eligibility determination flag"
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: match_eligibility_reason
        description: "Epic E058 Phase 2: Reason code for match eligibility determination"
        data_tests:
          - not_null
          - accepted_values:
              values: ["backward_compatibility_simple_rule", "insufficient_hours", "insufficient_tenure", "inactive_eoy", "eligible"]
      - name: match_status
        description: "Epic E058 Phase 2: Match calculation status tracking"
        data_tests:
          - not_null
          - accepted_values:
              values: ["ineligible", "no_deferrals", "calculated"]
      - name: capped_match_amount
        description: "Epic E058 Phase 2: Match amount after formula caps (before eligibility filtering)"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 50000
      - name: uncapped_match_amount
        description: Selected formula result before the deferral-based plan cap.
      - name: match_percentage_of_comp
        description: Final employer match divided by eligible compensation.
      - name: eligibility_config_applied
        description: "Epic E058 Phase 2: Whether eligibility configuration was applied (vs backward compatibility)"
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: applied_years_of_service
        description: >
          Exact integer service basis used by graded_by_service, tenure_graded,
          and points_based match modes. Equals FLOOR of the current-year
          authoritative workforce current_tenure, including termination-date
          service. NULL for deferral-based matching.
      - name: created_at
        description: Nondeterministic model-build timestamp; excluded from canonical parity.
      - name: scenario_id
        description: Simulation scenario identifier.
      - name: parameter_scenario_id
        description: Scenario identifier associated with the exported parameter set.
    data_tests:
      - unique:
          column_name: "employee_id || '_' || plan_design_id || '_' || simulation_year"
      # Epic E058 Phase 4: Business logic validation tests for match calculations
      - dbt_utils.expression_is_true:
          name: "e058_ineligible_employees_zero_match"
          expression: >
            (SELECT COUNT(*) FROM int_employee_match_calculations
             WHERE is_eligible_for_match = false AND employer_match_amount > 0) = 0
          config:
            severity: error
            error_if: ">= 1"
      - dbt_utils.expression_is_true:
          name: "e058_eligible_with_deferrals_have_match_calculation"
          expression: >
            (SELECT COUNT(*) FROM int_employee_match_calculations
             WHERE is_eligible_for_match = true AND annual_deferrals > 0 AND match_status = 'ineligible') = 0
          config:
            severity: error
            error_if: ">= 1"
      - dbt_utils.expression_is_true:
          name: "e058_match_status_consistency_with_eligibility"
          expression: >
            (SELECT COUNT(*) FROM int_employee_match_calculations
             WHERE (match_status = 'ineligible' AND is_eligible_for_match = true) OR
                   (match_status != 'ineligible' AND is_eligible_for_match = false)) = 0
          config:
            severity: error
            error_if: ">= 1"
      - dbt_utils.expression_is_true:
          name: "e058_match_eligibility_reason_alignment"
          expression: >
            (SELECT COUNT(*) FROM int_employee_match_calculations
             WHERE match_eligibility_reason = 'eligible' AND is_eligible_for_match = false) = 0
          config:
            severity: error
            error_if: ">= 1"
      - dbt_utils.expression_is_true:
          name: "e058_capped_match_amount_consistency"
          expression: >
            (SELECT COUNT(*) FROM int_employee_match_calculations
             WHERE capped_match_amount < 0 OR
                   (is_eligible_for_match = true AND capped_match_amount < employer_match_amount)) = 0
          config:
            severity: error
            error_if: ">= 1"
      - dbt_utils.expression_is_true:
          name: "e058_no_deferrals_status_consistency"
          expression: >
            (SELECT COUNT(*) FROM int_employee_match_calculations
             WHERE match_status = 'no_deferrals' AND annual_deferrals > 0) = 0
          config:
            severity: error
            error_if: ">= 1"

  - name: int_employee_contributions
    description: >
      Employee contribution calculation model using sophisticated period-based methodology.
      Calculates time-weighted contributions with deferral rate changes, IRS limit enforcement,
      and comprehensive data quality validation.
    config:
      tags: ["contribution", "critical", "core_calculation"]
    data_tests:
      # Feature 101: the windowed base can never exceed employment-prorated comp
      - dbt_utils.expression_is_true:
          expression: "total_contribution_base_compensation <= prorated_annual_compensation + 0.01"
      # The model caps contributions at the age-appropriate IRS 402(g) limit. Assert
      # that invariant directly rather than a static numeric ceiling — the limit rises
      # year over year (super-catch-up reaches $39,250 by 2035 in config_irs_limits),
      # so any fixed max_value would false-fail in later simulation years.
      - dbt_utils.expression_is_true:
          expression: "annual_contribution_amount <= applicable_irs_limit + 0.01"
          name: "annual_contribution_amount_within_irs_limit"
      # Uniqueness is on the (employee_id, simulation_year) grain — this is a
      # multi-year incremental table, so employee_id alone is NOT unique.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - employee_id
            - simulation_year
          name: "unique_employee_per_contribution_year"
    columns:
      - name: employee_id
        description: Unique employee identifier
        data_tests:
          - not_null
      - name: simulation_year
        description: Simulation year for these contributions
        data_tests:
          - not_null
      - name: prorated_annual_compensation
        description: Time-weighted annual compensation used for contribution calculations
        data_tests:
          - not_null
          # Executives legitimately exceed $500k; bound generously to catch gross
          # data errors without flagging real high earners.
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 2000000
      - name: annual_contribution_amount
        description: IRS-limited contributions after applying 402(g) limits
        data_tests:
          - not_null
          # Upper bound is the age-appropriate IRS limit, asserted at the model level
          # via annual_contribution_amount_within_irs_limit (the limit is not constant
          # across years, so only the non-negativity floor is checked here).
          - dbt_utils.accepted_range:
              min_value: 0
      - name: amount_capped_by_irs_limit
        description: Amount of contributions exceeding IRS limits that were capped
        data_tests:
          - not_null
          # = requested contribution − IRS limit; high earners deferring large
          # percentages can exceed the old $50k bound.
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 200000
      - name: effective_annual_deferral_rate
        description: Time-weighted effective deferral rate for the year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1.0
      # Feature 101: active-enrollment-window proration
      - name: total_contribution_base_compensation
        description: >
          Compensation base the deferral rate is applied to. Equals prorated_annual_compensation
          except for same-year enroll→opt-out employees, where it is scaled to the active-enrollment window.
          The upper bound (≤ prorated_annual_compensation) is enforced by the model-level
          expression_is_true test, so no fixed max is asserted here (avoids duplicating the
          pre-existing exec-comp > 500k range failure on prorated_annual_compensation).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: active_enrollment_days
        description: >
          Days credited for the active-enrollment window (enrollment→opt-out, bounded by employment).
          0 for full-year participants and degenerate/zero-day windows (Feature 101).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 366
      - name: contribution_window_category
        description: "'enroll_optout_window' | 'full_year' | 'partial_year' (Feature 101)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['enroll_optout_window', 'full_year', 'partial_year']
      - name: contribution_periods_count
        description: Number of contribution periods calculated for this employee

  - name: int_deferral_rate_state_accumulator
    description: >
      Enhanced temporal state accumulator (v2) for employee deferral rates across years.
      Replaces legacy int_deferral_escalation_state_accumulator and is the canonical source for contributions.
    config:
      tags: ["state_accumulator", "critical", "e036", "v2"]
    data_tests:
      # Uniqueness at the scenario/plan/employee/year grain
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - scenario_id
            - plan_design_id
            - employee_id
            - simulation_year
          config:
            severity: warn
      # Temporal continuity - non-decreasing escalation count (known limitation in multi-year accumulation)
      - dbt_utils.expression_is_true:
          expression: >
            (SELECT COUNT(*) FROM (
              SELECT
                employee_id,
                simulation_year,
                escalations_received,
                LAG(escalations_received) OVER (PARTITION BY scenario_id, plan_design_id, employee_id ORDER BY simulation_year) as prev_escalations
              FROM int_deferral_rate_state_accumulator
            ) t
            WHERE escalations_received < COALESCE(prev_escalations, 0)) = 0
          config:
            severity: warn
      # Deferral rate progression - generally non-decreasing, allow minor negative due to opt-outs (warn only)
      - dbt_utils.expression_is_true:
          expression: >
            (SELECT COUNT(*) FROM (
              SELECT
                employee_id,
                simulation_year,
                current_deferral_rate,
                LAG(current_deferral_rate) OVER (PARTITION BY scenario_id, plan_design_id, employee_id ORDER BY simulation_year) as prev_rate
              FROM int_deferral_rate_state_accumulator
            ) t
            WHERE current_deferral_rate < COALESCE(prev_rate, 0) - 0.001) = 0
          config:
            severity: warn
            error_if: ">= 1"
      # No escalations recorded for terminated employees in the same year
      - dbt_utils.expression_is_true:
          expression: >
            (SELECT COUNT(*) FROM int_deferral_rate_state_accumulator acc
             LEFT JOIN int_employee_compensation_by_year comp
             ON acc.employee_id = comp.employee_id AND acc.simulation_year = comp.simulation_year
             WHERE comp.employment_status = 'terminated'
             AND acc.escalation_events_this_year > 0) = 0
          config:
            severity: error
            error_if: ">= 1"
      # Sanity: no rates above 50%
      - dbt_utils.expression_is_true:
          expression: >
            (SELECT COUNT(*) FROM int_deferral_rate_state_accumulator
             WHERE current_deferral_rate > 0.5) = 0
          config:
            severity: error
            error_if: ">= 1"
    columns:
      - name: employee_id
        description: Unique employee identifier
        data_tests:
          - not_null
      - name: simulation_year
        description: Simulation year for state accumulation
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: "{{ var('simulation_start_year', 2025) }}"
              max_value: "{{ var('simulation_end_year', 2029) }}"
              config:
                severity: error
      - name: current_deferral_rate
        description: Current effective deferral rate after escalations
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 0.5
              config:
                severity: error
      - name: escalations_received
        description: Cumulative escalations received
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 10
              config:
                severity: error
      - name: total_escalation_amount
        description: Cumulative deferral rate increase from all escalations
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 0.5
              config:
                severity: error
      - name: escalation_events_this_year
        description: Count of escalation events in current simulation year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 3
              config:
                severity: error
      - name: had_escalation_this_year
        description: Boolean flag indicating if employee received escalation in current year
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
              config:
                severity: error
      - name: has_escalations
        description: Boolean flag indicating if employee has ever received escalations
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
              config:
                severity: error
      - name: original_deferral_rate
        description: Employee's original baseline deferral rate
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 0.5
              config:
                severity: error
      - name: escalation_rate_change_pct
        description: Percentage change from original rate due to escalations
        data_tests:
          - dbt_utils.accepted_range:
              min_value: -0.1
              max_value: 10.0
              config:
                severity: warn
      - name: years_since_first_escalation
        description: Years since first escalation (NULL if no escalations)
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 10
              config:
                severity: warn
      - name: days_since_last_escalation
        description: Days since last escalation (NULL if no escalations)
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 3650
              config:
                severity: warn
      - name: scenario_id
        description: Scenario identifier for multi-scenario planning
        data_tests:
          - not_null
          - accepted_values:
              values: ['default', 'scenario_1', 'scenario_2']
              config:
                severity: warn
      - name: data_quality_flag
        description: Enhanced data quality validation flag with comprehensive checks
        data_tests:
          - not_null
          - accepted_values:
              values: ["VALID", "INVALID_EMPLOYEE_ID", "INVALID_SIMULATION_YEAR", "INVALID_DEFERRAL_RATE", "INVALID_DEFERRAL_RATE_RANGE", "INVALID_ESCALATION_COUNT"]
              config:
                severity: error
      - name: created_at
        description: Timestamp when record was created for audit trail
        data_tests:
          - not_null
  - name: int_workforce_needs
