version: 2

models:
  - name: dim_hazard_table
    description: "Master hazard dimension table with termination, promotion, and merit rates"
    config:
      tags: ["critical", "foundation"]
    columns:
      - name: year
        description: "Simulation year"
        data_tests:
          - not_null
      - name: level_id
        description: "Job level identifier"
        data_tests:
          - not_null
      - name: tenure_band
        description: "Employee tenure band"
        data_tests:
          - not_null
      - name: age_band
        description: "Employee age band"
        data_tests:
          - not_null
      - name: termination_rate
        description: "Annual termination probability"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: promotion_rate
        description: "Annual promotion probability"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: merit_raise
        description: "Annual merit increase percentage"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.5

  - name: fct_yearly_events
    description: >-
      Consolidated workforce events by simulation year. Publication atomically
      replaces the active scenario/year after schema synchronization, preserving
      other scenarios and years. Native DuckDB type changes avoid ALTER/DML
      transaction conflicts when rebuilding a copied calibration database.
    config:
      tags: ["critical", "locked", "event_sourcing", "contract"]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "simulation_year BETWEEN {{ var('simulation_start_year', 2025) }} AND {{ var('simulation_end_year', 2029) }}"
    columns:
      - name: event_id
        description: "Deterministic event identity preserved from current-year assembly"
        data_type: varchar
        data_tests: [not_null, unique]
      - name: scenario_id
        description: "Scenario partition key"
        data_type: varchar
        data_tests: [not_null]
      - name: plan_design_id
        description: "Plan-design partition key"
        data_type: varchar
        data_tests: [not_null]
      - name: employee_id
        description: "Unique employee identifier"
        data_type: varchar
        data_tests:
          - not_null
      - name: employee_ssn
        description: "Employee SSN identifier"
        data_type: varchar
        data_tests:
          - not_null
      - name: event_type
        description: "Type of workforce event"
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['termination', 'promotion', 'hire', 'raise', 'enrollment', 'enrollment_change', 'deferral_escalation', 'deferral_match_response', 'eligibility']
      - name: simulation_year
        description: "Year of simulation"
        data_type: integer
        data_tests:
          - not_null
      - name: effective_date
        description: "Date when event becomes effective"
        data_type: timestamp
        data_tests:
          - not_null
      - name: event_details
        description: "Detailed description of the event"
        data_type: varchar
      - name: compensation_amount
        description: "Compensation amount related to event"
        data_type: double
        # Temporarily disabled - some events (enrollment, deferral escalation) don't have compensation
      - name: previous_compensation
        description: "Previous compensation amount before event"
        data_type: double
      - name: employee_age
        description: "Employee age at time of event"
        data_type: bigint
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 18
                max_value: 75
      - name: employee_tenure
        description: "Employee tenure at time of event"
        data_type: decimal(21,2)
      - name: level_id
        description: "Employee job level"
        data_type: integer
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
      - name: age_band
        description: "Employee age band for analysis"
        data_type: varchar
      - name: tenure_band
        description: "Employee tenure band for analysis"
        data_type: varchar
      - name: event_probability
        description: "Probability associated with the event"
        data_type: double
      - name: event_category
        description: "Category of event for analysis"
        data_type: varchar
      - name: event_sequence
        description: "Sequence number for events within employee/year"
        data_type: bigint
        data_tests:
          - not_null
      - name: created_at
        description: "Timestamp when record was created"
        data_type: timestamp with time zone
      - name: parameter_scenario_id
        description: "Scenario ID for parameter tracking"
        data_type: varchar
      - name: parameter_source
        description: "Source of parameters used"
        data_type: varchar
      - name: data_quality_flag
        description: "Data quality validation flag"
        data_type: varchar
      - name: employee_deferral_rate
        description: "Employee's elected deferral percentage (0.00 to 0.75)"
        data_type: decimal(5,4)
      - name: prev_employee_deferral_rate
        description: "Previous deferral rate before change"
        data_type: decimal(5,4)


  - name: fct_workforce_snapshot
    description: "Year-end workforce snapshot showing current state after all events"
    config:
      tags: ["critical", "foundation", "contract"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - scenario_id
              - plan_design_id
              - employee_id
              - simulation_year
          name: "unique_scenario_plan_employee_per_simulation_year"
    columns:
      - name: employee_id
        description: "Unique employee identifier within simulation year"
        data_type: varchar
        data_tests:
          - not_null
      - name: employee_ssn
        description: "Employee SSN identifier"
        data_type: varchar
        data_tests:
          - not_null
      - name: employee_birth_date
        description: "Employee birth date"
        data_type: timestamp
      - name: employee_hire_date
        description: "Employee hire date"
        data_type: timestamp
      - name: current_compensation
        description: "Current annual compensation"
        data_type: double
        data_tests:
          - not_null
          # **NEW COMPENSATION BOUNDS TESTS** - Comprehensive validation to prevent inflation issues
          # Critical bound: No compensation should exceed $10M
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 10000000
              config:
                severity: error
              name: "compensation_critical_upper_bound"
          # Warning bound: Flag compensation over $5M for review
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 5000000
              config:
                severity: warn
                where: "employment_status = 'active'"
              name: "compensation_warning_upper_bound"
          # Lower bound: Active employees should have reasonable compensation
          - dbt_utils.accepted_range:
              arguments:
                min_value: 10000
                max_value: 50000000
              config:
                where: "employment_status = 'active'"
              name: "active_compensation_reasonable_lower_bound"
      - name: prorated_annual_compensation
        description: "Prorated annual compensation based on actual time worked"
        data_type: double
      - name: full_year_equivalent_compensation
        description: "Full-year equivalent compensation eliminating proration effects"
        data_type: double
      - name: current_age
        description: "Current employee age"
        data_type: bigint
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 18
                max_value: 75
      - name: current_tenure
        description: "Current years of service"
        data_type: bigint
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 50
      - name: level_id
        description: "Current job level"
        data_type: integer
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
      - name: age_band
        description: "Employee age band for analysis"
        data_type: varchar
      - name: tenure_band
        description: "Employee tenure band for analysis"
        data_type: varchar
      - name: employment_status
        description: "Current employment status"
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'terminated']
      - name: termination_date
        description: "Date of termination if applicable"
        data_type: timestamp
      - name: termination_reason
        description: "Reason for termination if applicable"
        data_type: varchar
      - name: detailed_status_code
        description: "Epic 11.5: Detailed status code categorizing employees into four cohorts"
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['continuous_active', 'experienced_termination', 'new_hire_active', 'new_hire_termination']
      - name: simulation_year
        description: "Simulation year for this snapshot"
        data_type: integer
        data_tests:
          - not_null
      - name: employee_eligibility_date
        description: >
          Computed target date when an employee satisfies the DC-plan timing
          rules. This may be later than the census cutoff used for the
          start-year status and does not by itself transition reported state.
        data_type: date
      - name: waiting_period_days
        description: "Number of days employee must wait after hire to become eligible"
        data_type: integer
      - name: current_eligibility_status
        description: >
          Reported DC-plan eligibility state, as of the end of the simulation
          year.

          The start-year value preserves the census observation as of the
          pre-simulation census cutoff (`stg_census_data` compares
          `hire_date + eligibility_waiting_period_days` against
          `plan_year_end_date`), so `pending` may coexist with a target
          `employee_eligibility_date` inside the first simulation year.

          After the start year, an immutable `eligibility` event is the
          authoritative transition signal: an employee reported `pending`
          becomes `eligible` in the year their event fires, and stays
          `eligible` thereafter. Start-year events are deliberately withheld so
          the census distribution is not rewritten.

          An employee in their hire year has neither a census row nor a
          prior-year row, so their status comes from their own hire-year event:
          `eligible` if `int_eligibility_events` emitted one, `pending`
          otherwise. The start-year hold does not apply to them -- it protects
          census provenance, and a new hire has no census observation. `pending`
          therefore covers a waiting period running past Dec 31, a hire below
          `minimum_age`, and a Feature 103 (`new_hire_ineligible_pct`) new hire
          held ineligible for the whole horizon (#499).

          `planalign_api/services/ndt_service.py` filters the ADP/ACP test
          population on this column (`= 'eligible' OR IS NULL`), so it gates
          NDT results as well as reporting. Contribution and enrollment
          eligibility are determined by their dedicated plan-eligibility
          models, not by this field.
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['eligible', 'pending']
      - name: employee_enrollment_date
        description: "Date when employee enrolled in DC plan (from census data or enrollment events)"
        data_type: date
      - name: is_enrolled_flag
        description: "Whether employee is enrolled in DC plan"
        data_type: boolean
      - name: current_deferral_rate
        description: "Employee's current contribution deferral rate"
        data_type: decimal(5,4)
      - name: last_escalation_date
        description: Last escalation effective date; TIMESTAMP in every simulation year
        data_type: timestamp
      - name: total_escalation_amount
        description: Cumulative escalation amount; DECIMAL(5,4) in every simulation year
        data_type: decimal(5,4)
      # Epic E034: Employee contribution columns
      - name: prorated_annual_contributions
        description: "Prorated annual contribution amount based on employment periods"
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 50000
      - name: contribution_source_policy
        description: "Explicit legacy_estimate (85/15) or analyst assumed_split; neither is an observed election."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['legacy_estimate', 'assumed_split']
      - name: assumed_roth_fraction
        description: "Ordinary assumed Roth fraction before mandatory catch-up allocation."
      - name: contribution_source_version
        description: "Version of the source allocation algorithm."
      - name: mandatory_roth_status
        description: "Scoped base-limit catch-up assessment; unresolved/unsupported/blocked results are not compliance assertions."
        data_tests:
          - not_null
      - name: mandatory_roth_required
        description: "Required modeled Roth catch-up dollars; NULL when unresolved or not evaluated."
      - name: mandatory_roth_reallocated
        description: "Additional dollars moved from the preferred pre-tax allocation to Roth; existing Roth credited."
      - name: disallowed_catch_up_contributions
        description: "Catch-up dollars excluded from the source allocation when the plan lacks Roth, the employee is ineligible, or the total exceeds the modeled age limit. Pre-tax plus Roth plus this amount reconciles to ytd_contributions."
      - name: prior_year_employer_fica_wages
        description: "Matched prior-calendar-year sponsoring-employer section 3121(a) wages; NULL is unavailable, zero is known zero."
      - name: prior_year_wage_basis
        description: "confirmed or forecast as supplied, or structural for a current-year hire without prior-year employer wage evidence; no salary substitution."
      - name: prior_year_wage_provenance
        description: "Analyst-supplied evidence provenance for the matched wage record."
      - name: source_employer_id
        description: "Employer identifier used for the wage evidence lookup."
      - name: source_wage_year
        description: "Prior calendar year used for the wage evidence lookup."
      - name: source_year_end_age
        description: "Calendar-year-end age from birth year, not a start-year age proxy."
      - name: mandatory_roth_threshold
        description: "Nearest-year IRS seed wage threshold unless an explicit projected_thresholds assumption overrides it; comparison is strictly greater than."
      - name: mandatory_roth_threshold_basis
        description: "published, projected, or unavailable."
      - name: mandatory_roth_threshold_provenance
        description: "Published authority or analyst projection provenance."
      - name: mandatory_roth_rule_version
        description: "Version of the modeled mandatory Roth rules and applicability assumptions."
      - name: contribution_source_assumptions
        description: "Disclosure of estimated elections and unsupported plan-limit/ADP catch-up triggers."
      - name: pre_tax_contributions
        description: "Estimated allowed pre-tax allocation in cents. Excludes disallowed_catch_up_contributions."
        data_type: decimal(18,2)
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 50000
      - name: roth_contributions
        description: "Estimated allowed Roth allocation in cents, inclusive of modeled required catch-up. Excludes disallowed_catch_up_contributions; not payroll evidence."
        data_type: decimal(18,2)
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 50000
      - name: ytd_contributions
        description: "Year-to-date total contributions"
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 50000
      - name: irs_limit_reached
        description: "Whether employee has reached IRS 402(g) contribution limits"
        data_type: boolean
        data_tests:
          - not_null
      - name: effective_annual_deferral_rate
        description: "Effective annual deferral rate based on actual contributions"
        data_type: double
      - name: total_contribution_base_compensation
        description: "Total compensation used in contribution calculations"
        data_type: double
      - name: first_contribution_date
        description: "Date of first contribution in the year"
        data_type: date
      - name: last_contribution_date
        description: "Date of last contribution in the year"
        data_type: date
      - name: contribution_quality_flag
        description: "Data quality flag for contribution calculations"
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['NORMAL', 'HIGH_CONTRIBUTION_RATE', 'MULTIPLE_RATE_CHANGES', 'SHORT_CONTRIBUTION_PERIOD', 'IRS_LIMITED']
      - name: compensation_quality_flag
        description: "**E066 Enhanced** Compensation quality validation flag with annualization context"
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NORMAL', 'WARNING_OVER_2M', 'WARNING_UNDER_10K', 'WARNING_ANNUALIZED_LATE_HIRE', 'WARNING_INFLATION_5X', 'SEVERE_OVER_5M', 'SEVERE_INFLATION_10X', 'CRITICAL_OVER_10M', 'CRITICAL_OVER_20M', 'CRITICAL_OVER_50M', 'CRITICAL_INFLATION_50X', 'CRITICAL_INFLATION_100X']
              config:
                severity: error
      - name: snapshot_created_at
        description: "Timestamp when snapshot was created"
        data_type: timestamp with time zone



  - name: fct_compensation_growth
    description: "Compensation growth fact table validation"
    config:
      tags: ["critical"]

# Note: Cross-table consistency tests are implemented in separate analysis models
# See data_quality_new_hire_termination_audit.sql and data_quality_event_sourcing_integrity.sql
