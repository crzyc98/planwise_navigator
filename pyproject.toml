[project]
name = "fidelity-planalign-engine"
version = "2.4.0"
description = "Fidelity PlanAlign Engine - Enterprise workforce simulation platform with immutable event sourcing"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Nicholas Amaral", email = "nicholas.amaral@gmail.com"}
]

dependencies = [
    # Core runtime dependencies
    "duckdb==1.5.5",
    "dbt-core==1.12.5",
    "dbt-duckdb==1.11.0",
    "pydantic==2.13.5",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    # Performance optimization dependencies
    "lz4>=4.3.3",
    "psutil>=5.9.0",
    "networkx>=3.0",
    "matplotlib>=3.8.0",
    "weasyprint>=62.0",
    "python-pptx>=0.6.23",
    # Excel export dependencies
    "openpyxl>=3.1.0",
    # Corporate network and HTTP client dependencies
    "requests>=2.28.0",
    "urllib3>=1.26.0",
    # CLI dependencies for Fidelity PlanAlign Engine CLI
    "rich>=13.0.0",
    "typer>=0.9.0",
    "inquirer>=3.1.0",
    # API dependencies for PlanAlign Studio backend
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    # Git sync dependencies (E083)
    "GitPython>=3.1.0",
    # Export/Import dependencies (031-workspace-export)
    "py7zr>=1.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-xdist==3.8.0",
    "pytest-split==0.11.0",
    "hypothesis>=6.0.0",
    "factory-boy==3.3.3",
    "Faker==40.39.0",

    # Code Quality
    "ruff==0.16.8",
    "black==26.5.1",
    "isort==9.0.1",
    "mypy==2.3.1",
    # Type stubs for the CI mypy lint job (see requirements-dev.txt / #333)
    "types-PyYAML==6.0.12.20260906",
    "pylint==4.0.8",
    "flake8==7.3.0",
    "pre-commit==4.6.2",

    # Docs / Dev tools
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mkdocstrings-python==2.0.8",
    "jupyter==1.1.1",
    "ipython==9.17.1",
    "ipdb==0.13.13",
]

[project.scripts]
planalign = "planalign_cli.main:cli_main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "planalign_orchestrator",
    "planalign_orchestrator.pipeline",
    "planalign_cli",
    "planalign_cli.commands",
    "planalign_cli.integration",
    "planalign_cli.ui",
    "planalign_cli.utils",
    "planalign_api",
    "planalign_api.models",
    "planalign_api.routers",
    "planalign_api.services",
    "planalign_api.storage",
    "planalign_api.websocket",
    "planalign_core",
    "planalign_core.events",
    "planalign_fit",
    "planalign_backtest",
    "planalign_ensemble",
    "planalign_evidence",
    "planalign_optimizer",
]
py-modules = ["_version"]

[tool.setuptools.package-data]
planalign_orchestrator = ["py.typed"]

[tool.pytest.ini_options]
# Exclude third-party packages and non-test directories
testpaths = ["tests"]
norecursedirs = [
    ".*",
    "dbt",
    "dbt_packages",
    "venv",
    ".venv",
    "*.egg",
    "dist",
    "build",
    "docs",
    "scripts",
]

# Test discovery patterns
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Console output
console_output_style = "progress"
addopts = [
    "-ra",                    # Show summary of all test outcomes
    "--strict-markers",       # Error on unregistered markers
    "--strict-config",        # Error on config issues
    "--showlocals",          # Show local variables in tracebacks
    "--tb=short",            # Shorter traceback format
    "-p no:warnings",        # Suppress warnings during collection
]

# Test markers
markers = [
    # Execution speed markers
    "fast: Fast unit tests (<1s each)",
    "slow: Slow integration tests (1-10s each)",
    "very_slow: E2E tests (10s+ each)",

    # Test type markers
    "unit: Pure unit tests (no I/O)",
    "integration: Integration tests (database, dbt)",
    "multi_year_invariants: Three-year invariant and determinism suite",
    "edge_config_matrix: Four-case edge configuration regression matrix",
    "e2e: End-to-end workflow tests",

    # Feature area markers
    "orchestrator: Orchestrator component tests",
    "events: Event schema tests",
    "dbt: dbt integration tests",
    "cli: CLI command tests",
    "threading: Multi-threading tests",
    "config: Configuration validation tests",

    # Quality markers
    "smoke: Critical path smoke tests",
    "regression: Regression test suite",
    "performance: Performance and benchmarking tests",
    "stress: Stress tests for high-load scenarios",

    # Legacy markers
    "edge_case: Edge case and boundary testing",
    "error_handling: Error handling validation tests",
    "database: Tests requiring database access",
    "asyncio: Async tests using asyncio event loop",
]

# Coverage options (when using pytest-cov)
[tool.coverage.run]
source = ["planalign_orchestrator", "planalign_cli", "planalign_api", "planalign_core", "planalign_optimizer"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/dbt/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
# The CI lint job runs `mypy planalign_orchestrator/ planalign_cli/ planalign_core/
# --ignore-missing-imports`; mypy auto-loads this section. The Pydantic v2 plugin
# teaches mypy about model-synthesized __init__ (field defaults, default_factory),
# eliminating false-positive [call-arg] "Missing named argument" errors on valid
# model construction. ignore_missing_imports mirrors the CI flag for local parity.
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
