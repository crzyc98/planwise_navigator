repos:
  # Basic syntax and formatting checks that don't require full environment
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags used by dbt
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # Python syntax validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-ast  # Python syntax check

  # Formatting & linting — check-only hooks deliberately do not rewrite files
  # during commit. This keeps partially staged files safe; format explicitly
  # before staging when a check fails. Versions match pyproject/CI.
  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black
        args: ["--check"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.3
    hooks:
      - id: ruff

  # Local validation reminder (non-blocking)
  - repo: local
    hooks:
      - id: staged-whitespace-check
        name: staged whitespace check
        entry: git diff --cached --check
        language: system
        pass_filenames: false
        verbose: true
      - id: ci-reminder
        name: ci-validation-reminder
        entry: "bash -c 'echo \"💡 Before pushing: pytest -m fast && (cd dbt && dbt compile)\"'"
        language: system
        files: '(dbt/.*\.(sql|yml|yaml)|orchestrator/.*\.py)$'
        pass_filenames: false
        verbose: true
